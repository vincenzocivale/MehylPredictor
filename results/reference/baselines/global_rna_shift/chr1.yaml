status: reference
model: global_rna_shift
architecture: VarianceNormalizedResidualModel, interaction.kind=global_shift (GlobalShiftInteraction)
training_scope: chr1
seed: 17
training:
  learning_rate: 5.0e-5
  scheduler: constant
  epochs: 80
  array_batch: [512, 512]
  sources: [array, epic, wgbs]
evaluation:
  chr1:
    train_cpg_x_val_sample: {mas_pcc: 0.3297, mse: 0.02069}
    val_cpg_x_train_sample: {mas_pcc: 0.2488, mse: 0.02547}
    val_cpg_x_val_sample: {mas_pcc: 0.2343, mse: 0.02535}
benchmark_role: baseline vs. MethylProphet-matched chromosome-1 comparison
note: >
  "Global RNA Shift" baseline (docs/PAPER_EXPERIMENTS.md): a single patient-specific
  correction derived from RNA, with no CpG-specific modeling of the RNA effect
  (GlobalShiftInteraction ignores the CpG embedding entirely -- raw_delta is
  constant across every locus for a given sample). Substantially below the
  canonical model (val-CpG x val-sample MAS-PCC 0.2343 vs 0.5613,
  results/reference/rna_methylation/chr1.yaml) and below MethylProphet's own
  published number (0.3904) on the same view -- consistent with global
  per-patient shifts alone being insufficient without CpG-specific effects.
