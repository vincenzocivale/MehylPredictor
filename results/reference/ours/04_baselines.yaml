# B.4 — Simplified baselines, current architecture, chr1 AND chr123 (P2) — ALL 8 CELLS CLOSED
# chr1 arms below; chr123 arms (all 4 closed 2026-09-07) at the bottom of this file -- see
# logs/b1_final_reference/queue_chr123_baselines.log.

study: baselines
source: ours
arms:

  - arm: cpg_prior
    status: confirmed_official
    description: >
      Zero-parameter -- prediction is the cached CpGStatisticsPredictor prior mu directly
      (CpGPriorEvaluator), no RNA input, no training.
    checkpoint: null   # not applicable, no model
    metrics:
      chr1:
        train_cpg_x_val_sample: {mas_pcc: null, mac_pcc: 0.9245, mse: 0.02384}
        val_cpg_x_train_sample: {mas_pcc: null, mac_pcc: 0.9104, mse: 0.02734}
        val_cpg_x_val_sample:   {mas_pcc: null, mac_pcc: 0.9101, mse: 0.02779}
    note: mas_pcc is mathematically undefined (constant prediction per CpG across samples).

  - arm: global_rna_shift
    status: confirmed_official   # re-diagnosed 2026-09-06 -- see reassessment below
    description: >
      Raw branch sees RNA only, ignores the CpG embedding entirely (use_mean_branch=false,
      include_raw_cpg=false, use_raw_product=false). By construction, beta_hat is CONSTANT across
      every CpG for a given sample (only the patient-level RNA signal varies) -- see the recipe's
      own header comment.
    recipe: configs/models/baselines/baseline_global_rna_shift.yaml
    run_id: baseline-global-shift
    checkpoint: results/experiments/runs/locus_cls_joint/chr1/baseline-global-shift/checkpoints/best.pt
    checkpoint_exists_on_this_host: true
    metrics:
      chr1:
        train_cpg_x_val_sample: {mas_pcc: 0.3104, mac_pcc: null, mse: 0.1334, mae: 0.3372}
        val_cpg_x_train_sample: {mas_pcc: 0.2312, mac_pcc: null, mse: 0.1469, mae: 0.3567}
        val_cpg_x_val_sample:   {mas_pcc: 0.2188, mac_pcc: null, mse: 0.1471, mae: 0.3570}
    reassessment_2026_09_06: >
      Previously flagged found_but_suspicious_needs_review on the assumption that MSE this much
      worse than CpG Prior implied a broken config. Re-diagnosed by diffing this run's
      config.resolved.yaml against configs/models/baselines/baseline_global_rna_shift.yaml
      field-by-field: EVERY field matches (use_mean_branch=false, include_raw_cpg=false,
      use_raw_product=false, include_raw_rna=true, same loss/training/batching blocks) -- no
      misconfiguration found. Both "red flags" turn out to be the mathematically necessary
      consequence of this baseline's own definition, not bugs:
      1. High MSE: this baseline discards ALL locus-specific information, so it can only ever
         predict one constant value per patient across every CpG on chr1 -- and true methylation
         is dominated by BETWEEN-locus variance (CpG islands near 0, gene bodies/repeats near 1),
         not between-patient variance. CpG Prior's low MSE captures exactly that dominant
         between-locus signal (it varies its prediction per CpG, just not per patient) -- the
         opposite restriction. A baseline built to prove "patient-level RNA alone is not enough"
         losing badly to a zero-parameter per-locus constant is the expected, correct result, not
         evidence of brokenness.
      2. mac_pcc=NaN: mac_pcc is the across-CpG Pearson correlation for a given sample; a
         perfectly constant prediction across CpGs has zero variance, making the correlation
         mathematically undefined (0/0) -- the exact mirror-image of cpg_prior's mas_pcc=null
         (constant across samples for a given CpG -> across-sample correlation undefined). Expected
         for both baselines, not a defect in either.
      The `baseline-global-shift-invalid-settings-20260906T1025` directory (separate host path)
      was checked too: its locus_cls block is byte-identical to this run's -- whatever was
      "invalid" about it was not this axis (likely an unrelated data-path/CLI mistake in that
      specific abandoned attempt), and it does not cast doubt on the run captured here.
      The old engine's legacy 0.2343 MAS-PCC (docs/EXPERIMENT_ROADMAP.md) is not directly
      comparable -- different engine/architecture generation, not re-derivable by current code.
    note: >
      Numbers now trusted. MSE/MAE are the meaningful comparison metrics here (MAS-PCC is also
      reported and non-null, unlike CpG Prior, since MAS-PCC only needs prediction variance across
      SAMPLES for a fixed CpG -- which this baseline still has, via the RNA signal).

  - arm: bilinear_rna_cpg
    status: confirmed_official
    description: >
      Raw branch sees only the RNA×CpG product term (use_mean_branch=false, include_raw_rna=false,
      include_raw_cpg=false).
    recipe: configs/models/baselines/baseline_bilinear_rna_cpg.yaml
