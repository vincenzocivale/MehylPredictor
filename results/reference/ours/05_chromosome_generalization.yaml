summary_double_ood_view_vs_methylprophet_table8:
  # Val CpG x Val Sample (double-OOD, headline), MAS-PCC
  chr1_to_chr1:     {ours: 0.5838, methylprophet: 0.3904, delta: +0.1934}
  chr123_to_chr1:   {ours: 0.6177, methylprophet: 0.3505, delta: +0.2672}
  chr1_to_chr123:   {ours: 0.5381, methylprophet: 0.2513, delta: +0.2868}
  chr123_to_chr123: {ours: 0.5450, methylprophet: 0.3460, delta: +0.1990}

qualitative_finding: >
  MethylProphet's own Table 8 shows chr1->chr123 dropping sharply from chr1->chr1 (0.3904 -> 0.2513,
  -0.1391) -- their model does not transfer well to unseen chromosomes. Ours drops far less
  (0.5838 -> 0.5381, -0.0457) and both cross-scope cells beat every one of MethylProphet's own
  4 cells outright. This is a genuinely strong result for the paper's chromosomal-generalization
  claim -- the locus-conditioned architecture appears to learn a more transferable RNA->methylation
  relationship, not a function memorized per observed CpG. Single-seed evidence only; see
  01_final_chr1_model.yaml's single_seed_caveat, which applies here too.

engine_note_now_confirmed: >
  The cross-scope eval path (evaluate.py --engine shared_backbone against a matched_chr1-trained
  checkpoint, and --engine matched_chr1_shared_backbone against a shared_backbone-trained
  checkpoint) works cleanly with no errors or dimension mismatches -- the earlier
  cross_scope_eval_risk caveat is resolved, not just theoretically expected.
