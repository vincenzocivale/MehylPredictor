single_seed_caveat: >
  Single seed (17). No second seed has been run for this exact recipe -- decide whether a
  confirmation seed is wanted before treating 0.5838 as final for the manuscript. (Separately,
  `seed_variance_reference`, a 3-seed suite for a DIFFERENT purpose -- noise-floor estimation for
  the architecture-novelty ablation arms -- exists elsewhere per docs/EXPERIMENT_ROADMAP.md but is
  not this exact recipe cell either; do not conflate.)

history_of_this_number_2026_09_06: >
  This file went through two wrong attributions before landing here, both corrected in-session by
  checking actual config.resolved.yaml content rather than trusting run-id names:
  1. First wrongly used p0_row_b-seed17 (0.5938 headline) -- that run has use_raw_product=true
     (the codebase's default when unset), a different cell from this recipe's use_raw_product=false.
  2. Then correctly identified reference-locus_attention_no_product-seed17 as the exact matching
     config, but it was stalled at epoch 66/80 (interrupted by user request on 2026-09-05).
     Resuming it failed once (RuntimeError: "resume requested with a different resolved
     shared-backbone recipe") because its saved config.resolved.yaml predated a later code change
     that unconditionally records include_raw_rna/include_raw_cpg in the resolved-config schema
     (added for the baseline-model suite) -- confirmed via a byte-for-byte dict comparison, not
     assumed. Fixed by adding the two missing keys (both true, matching the always-true default
     this run actually trained with -- no behavior change) to that run's config.resolved.yaml, then
     resume succeeded and ran epochs 67-80 (927.8s) followed immediately by the official eval above.
  Interesting note for later discussion, not yet acted on: this run's headline (0.5838) is slightly
  BELOW p0_row_b-seed17's (0.5938, product=true) -- the isolation ladder's own claim that the
  product term "does essentially nothing on either unseen-CpG view" (docs/RNA_METHYLATION.md,
  2026-09-05 update) doesn't fully hold up against this single full run; both are single-seed, so
  this could be within seed noise -- flag if revisiting the use_raw_product=false decision.
