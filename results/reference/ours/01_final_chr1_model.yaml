# B.1 — Final chr1 reference model (P0, highest priority)
#
# Target config (agreed): RNA encoder = locus-conditioned cross-attention, K=64 program tokens,
# program_dim=256, 4 heads, query=raw NTv3, mean branch ON + mean supervision ON, raw product OFF.
# = configs/models/rna_methylation_locus_attention.yaml, unmodified.

source: ours
status: confirmed_official   # CLOSED 2026-09-06 21:39 UTC
description: >
  FeatureFusionArchitectureVariantModel, encoder.kind=locus_attention (n_programs=64,
  program_dim=256, n_heads=4, query_source=ntv3), use_mean_branch=true, aux_weight=0.15,
  use_raw_product=false -- byte-for-byte the adopted reference recipe. matched_chr1_shared_backbone
