# B.2 — RNA encoder comparison, official chr1 (P1), extended to chr123
#
# Same harness throughout (mean branch ON, raw product OFF, same loss/training budget) --
# only the RNA encoder (model.encoder.kind) changes per arm. chr1 is the primary
# comparison; a chr123 metrics block (--engine shared_backbone against the chr123
# compact cache, scripts/prepare_chr123_compact.py) was added per-arm for gene_pathway
# and bulkformer_147m to check the comparison generalizes past chr1 -- not a separate
# paper table, see docs/PAPER_ROADMAP.md's chr1->chr123 generalization framing.

study: rna_encoder_comparison
source: ours
arms:

  - arm: cross_attention (reference)
    status: confirmed_official   # CLOSED 2026-09-06 21:39 UTC (chr1), 2026-09-06 22:11 UTC (chr123)
    same_as: ../ours/01_final_chr1_model.yaml (chr1), ../ours/05_chromosome_generalization.yaml (chr123, the chr123->chr123 cell)
    checkpoint_chr1: MethylPredictionData/experiments/runs/locus_cls_joint/chr1/reference-locus_attention_no_product-seed17/checkpoints/best.pt
    checkpoint_chr123: MethylPredictionData/experiments/runs/locus_cls_joint/chr123/chr123-ref/checkpoints/best.pt
    metrics:
      chr1:
        train_cpg_x_val_sample: {mas_pcc: 0.7004, mac_pcc: 0.9634, mse: 0.0109, mae: 0.0632}
        val_cpg_x_train_sample: {mas_pcc: 0.6311, mac_pcc: 0.9527, mse: 0.0135, mae: 0.0684}
        val_cpg_x_val_sample:   {mas_pcc: 0.5838, mac_pcc: 0.9506, mse: 0.0143, mae: 0.0705}
      chr123:   # note: this checkpoint was TRAINED on chr123 (chr123-ref, its own dedicated run,
                # not the chr1 checkpoint evaluated cross-scope) -- the row-for-row comparable
                # number to every other chr123 arm below, all of which are also chr123-trained.
        train_cpg_x_val_sample: {mas_pcc: 0.6791, mac_pcc: 0.9600, mse: 0.0120, mae: 0.0669}
        val_cpg_x_train_sample: {mas_pcc: 0.6010, mac_pcc: 0.9495, mse: 0.0145, mae: 0.0709}
        val_cpg_x_val_sample:   {mas_pcc: 0.5450, mac_pcc: 0.9467, mse: 0.0157, mae: 0.0736}
    note: >
      NOT the same as p0_row_b-seed17 (0.5938) -- that run has use_raw_product=true (the
      codebase's default when the flag is unset), a different cell. See
      ../ours/01_final_chr1_model.yaml for the full correction history.

  - arm: enc_bottleneck_mlp
    status: confirmed_official
    description: >
      Reproduces the architecture of MethylProphet's own published RNA branch (BottleneckMLP
      "B_6-Wi_1024", 6 pre-norm residual blocks, width 1024, GELU), trained from scratch in place
      of the current encoder -- everything else (fixed frozen RNA cache, fusion, loss) identical.
    recipe: configs/models/arch_shared_backbone/enc_bottleneck_mlp.yaml
    run_id: arch-architecture_novelty_2026_09-shared-enc_bottleneck_mlp-seed17
    seed: 17
    checkpoint: results/experiments/runs/locus_cls_joint/chr1/arch-architecture_novelty_2026_09-shared-enc_bottleneck_mlp-seed17/checkpoints/best.pt
    checkpoint_exists_on_this_host: true
    metrics:
      chr1:
        train_cpg_x_val_sample: {mas_pcc: 0.6631, mac_pcc: 0.9588, mse: 0.0122, mae: 0.0679}
        val_cpg_x_train_sample: {mas_pcc: 0.6127, mac_pcc: 0.9516, mse: 0.0139, mae: 0.0703}
        val_cpg_x_val_sample:   {mas_pcc: 0.5810, mac_pcc: 0.9499, mse: 0.0145, mae: 0.0720}
      chr123:   # run_id: rnaenc-enc_bottleneck_mlp-final-seed17 (chr123 dir, different run than the
                # chr1 row above -- launched via this study's harness, not arch_suite.py), CLOSED
                # 2026-09-07 06:30 UTC
        train_cpg_x_val_sample: {mas_pcc: 0.6264, mac_pcc: 0.9543, mse: 0.0138, mae: 0.0726}
        val_cpg_x_train_sample: {mas_pcc: 0.5877, mac_pcc: 0.9484, mse: 0.0149, mae: 0.0729}
        val_cpg_x_val_sample:   {mas_pcc: 0.5414, mac_pcc: 0.9452, mse: 0.0159, mae: 0.0752}
    verdict: >
      underperforms cross-attention reference on every chr1 view; not promoted. On chr123 it's
      the best of the three RNA-encoder comparators (0.5414 vs gene_pathway's 0.4939 and
      bulkformer_147m's 0.4471) while still trailing the chr1 cross-attention reference (0.5838) --
      same qualitative ranking as chr1, no reordering at the harder scope.

  - arm: frozen_embedding_bulkrnabert
    description: >
      Frozen (not fine-tuned) BulkRNABert sample embedding, single trainable Linear adapter.
      15,259/19,062 (80.0%) BulkRNABert genes matched. Embedding cache is sample-level, not
      locus-specific, so the same cache (bulkrnabert_embeddings/tcga) serves chr1 and chr123.
    recipe: configs/models/arch_shared_backbone/enc_frozen_embedding_bulkrnabert.yaml
    chr1:
      status: confirmed_official
      run_id: arch-architecture_novelty_2026_09-shared-enc_frozen_embedding_bulkrnabert-seed17
      checkpoint: results/experiments/runs/locus_cls_joint/chr1/arch-architecture_novelty_2026_09-shared-enc_frozen_embedding_bulkrnabert-seed17/checkpoints/best.pt
      metrics:
        train_cpg_x_val_sample: {mas_pcc: 0.5795, mac_pcc: 0.9515, mse: 0.0145, mae: 0.0753}
        val_cpg_x_train_sample: {mas_pcc: 0.5321, mac_pcc: 0.9466, mse: 0.0156, mae: 0.0758}
        val_cpg_x_val_sample:   {mas_pcc: 0.5164, mac_pcc: 0.9465, mse: 0.0158, mae: 0.0765}
      verdict: underperforms cross-attention reference, larger gap than bottleneck_mlp; not promoted.
    chr123:
      status: confirmed_official   # CLOSED 2026-09-07 12:36 UTC
      run_id: arch-architecture_novelty_2026_09-shared-enc_frozen_embedding_bulkrnabert-chr123-seed17
      checkpoint: MethylPredictionData/experiments/runs/locus_cls_joint/chr123/arch-architecture_novelty_2026_09-shared-enc_frozen_embedding_bulkrnabert-chr123-seed17/checkpoints/best.pt
      checkpoint_sha256: a1019eac5d28dae88d4b614a83740818cfc3c79914893ca37ab85fec69151149
      metrics:
        train_cpg_x_val_sample: {mas_pcc: 0.5517, mac_pcc: 0.9478, mse: 0.0159, mae: 0.0793}
        val_cpg_x_train_sample: {mas_pcc: 0.5284, mac_pcc: 0.9449, mse: 0.0161, mae: 0.0771}
        val_cpg_x_val_sample:   {mas_pcc: 0.4928, mac_pcc: 0.9431, mse: 0.0169, mae: 0.0791}
      verdict: >
        Worst of the four chr123 comparators (bottleneck_mlp 0.5414, gene_pathway 0.4939,
        bulkrnabert 0.4928, bulkformer_147m 0.4471) except bulkformer_147m -- same rough ranking
        as chr1, still trailing the cross-attention reference; not promoted.

  - arm: gene_pathway
    status: confirmed_official   # CLOSED 2026-09-06 23:xx UTC
    description: >
      Trainable SurvPath-style biologically sparse gene→pathway encoder (our own implementation,
      NOT MethylProphet's gene-pathway variant from Table 9 -- see paper/table9_rna_encoder_ablation.md).
    recipe: configs/models/rna_encoder_comparison/enc_gene_pathway.yaml
    run_id: rnaenc-gene_pathway-final-seed17
    checkpoint: MethylPredictionData/experiments/runs/locus_cls_joint/chr1/rnaenc-gene_pathway-final-seed17/checkpoints/best.pt
    checkpoint_exists_on_this_host: true
    metrics:
      chr1:
        train_cpg_x_val_sample: {mas_pcc: 0.5873, mac_pcc: 0.9510, mse: 0.0144, mae: 0.0751}
        val_cpg_x_train_sample: {mas_pcc: 0.5845, mac_pcc: 0.9492, mse: 0.0146, mae: 0.0735}
        val_cpg_x_val_sample:   {mas_pcc: 0.5347, mac_pcc: 0.9466, mse: 0.0155, mae: 0.0760}
      chr123:   # run_id: rnaenc-gene_pathway-final-seed17 (chr123 dir), CLOSED 2026-09-06 23:xx UTC
        val_cpg_x_val_sample: {mas_pcc: 0.4939, mac_pcc: 0.9435, mse: 0.0168, mae: 0.0788}
    dev_run_for_reference: {run_id_dev: rnaenc-gene_pathway-development-seed17, val_cpg_x_val_sample_inner_mas_pcc: 0.5072}
    verdict: underperforms cross-attention reference (0.5838) but clears the MethylProphet
      gene-pathway context number (0.3959) on every chr1 view; holds up on chr123
      (0.4939), no collapse moving to the harder scope; not promoted.

  - arm: bulkformer_147m
    status: confirmed_official   # CLOSED 2026-09-06 23:xx UTC
    description: Frozen BulkFormer-147M sample embedding + trainable LayerNorm/Linear adapter.
    recipe: configs/models/rna_encoder_comparison/enc_frozen_bulkformer_147m.yaml
    run_id: rnaenc-bulkformer_147m-final-seed17
    checkpoint: MethylPredictionData/experiments/runs/locus_cls_joint/chr1/rnaenc-bulkformer_147m-final-seed17/checkpoints/best.pt
    checkpoint_exists_on_this_host: true
    metrics:
      chr1:
        train_cpg_x_val_sample: {mas_pcc: 0.5148, mac_pcc: 0.9467, mse: 0.0162, mae: 0.0804}
        val_cpg_x_train_sample: {mas_pcc: 0.4599, mac_pcc: 0.9436, mse: 0.0169, mae: 0.0800}
        val_cpg_x_val_sample:   {mas_pcc: 0.4586, mac_pcc: 0.9444, mse: 0.0169, mae: 0.0800}
      chr123:   # run_id: rnaenc-bulkformer_147m-final-seed17 (chr123 dir), CLOSED 2026-09-06 23:xx UTC
        val_cpg_x_val_sample: {mas_pcc: 0.4471, mac_pcc: 0.9412, mse: 0.0178, mae: 0.0819}
    dev_run_for_reference: {run_id_dev: rnaenc-bulkformer_147m-development-seed17, val_cpg_x_val_sample_inner_mas_pcc: 0.4516}
    verdict: underperforms cross-attention reference and gene_pathway on every chr1 view;
      on chr123 it's last of the three RNA-encoder comparators (0.4471 vs gene_pathway's
      0.4939 and enc_bottleneck_mlp's 0.5414); not promoted.
