# B.2 — RNA encoder comparison, official chr1 AND chr123 (P1)
#
# Same harness throughout (mean branch ON, raw product OFF, same loss/training budget) --
# only the RNA encoder (model.encoder.kind) changes per arm. chr123 coverage added 2026-09-07:
# gene_pathway + bulkformer_147m running on a second machine (chr1 AND chr123 both, per the
# user), frozen_embedding_bulkrnabert's chr123 arm queued on this host to merge on next push.

study: rna_encoder_comparison
source: ours
arms:

  - arm: cross_attention (reference)
    status: confirmed_official   # CLOSED 2026-09-06 21:39 UTC
    same_as: ../ours/01_final_chr1_model.yaml
    run_id: reference-locus_attention_no_product-seed17
    checkpoint: MethylPredictionData/experiments/runs/locus_cls_joint/chr1/reference-locus_attention_no_product-seed17/checkpoints/best.pt
    metrics:
      chr1:
        train_cpg_x_val_sample: {mas_pcc: 0.7004, mac_pcc: 0.9634, mse: 0.0109, mae: 0.0632}
        val_cpg_x_train_sample: {mas_pcc: 0.6311, mac_pcc: 0.9527, mse: 0.0135, mae: 0.0684}
        val_cpg_x_val_sample:   {mas_pcc: 0.5838, mac_pcc: 0.9506, mse: 0.0143, mae: 0.0705}
    note: >
      NOT the same as p0_row_b-seed17 (0.5938) -- that run has use_raw_product=true (the
      codebase's default when the flag is unset), a different cell. See
      ../ours/01_final_chr1_model.yaml for the full correction history.

  - arm: enc_bottleneck_mlp
    status: confirmed_official
    description: >
      Reproduces the architecture of MethylProphet's own published RNA branch (BottleneckMLP
      "B_6-Wi_1024", 6 pre-norm residual blocks, width 1024, GELU), trained from scratch in place
      of the current encoder -- everything else (fixed frozen RNA cache, fusion, loss) identical.
    recipe: configs/models/arch_shared_backbone/enc_bottleneck_mlp.yaml
    run_id: arch-architecture_novelty_2026_09-shared-enc_bottleneck_mlp-seed17
    seed: 17
    checkpoint: results/experiments/runs/locus_cls_joint/chr1/arch-architecture_novelty_2026_09-shared-enc_bottleneck_mlp-seed17/checkpoints/best.pt
    checkpoint_exists_on_this_host: true
    metrics:
      chr1:
        train_cpg_x_val_sample: {mas_pcc: 0.6631, mac_pcc: 0.9588, mse: 0.0122, mae: 0.0679}
        val_cpg_x_train_sample: {mas_pcc: 0.6127, mac_pcc: 0.9516, mse: 0.0139, mae: 0.0703}
        val_cpg_x_val_sample:   {mas_pcc: 0.5810, mac_pcc: 0.9499, mse: 0.0145, mae: 0.0720}
    verdict: underperforms cross-attention reference on every view; not promoted.

  - arm: frozen_embedding_bulkrnabert
    description: >
      Frozen (not fine-tuned) BulkRNABert sample embedding, single trainable Linear adapter.
      15,259/19,062 (80.0%) BulkRNABert genes matched. Embedding cache is sample-level, not
      locus-specific, so the same cache (bulkrnabert_embeddings/tcga) serves chr1 and chr123.
    recipe: configs/models/arch_shared_backbone/enc_frozen_embedding_bulkrnabert.yaml
    chr1:
      status: confirmed_official
      run_id: arch-architecture_novelty_2026_09-shared-enc_frozen_embedding_bulkrnabert-seed17
      checkpoint: results/experiments/runs/locus_cls_joint/chr1/arch-architecture_novelty_2026_09-shared-enc_frozen_embedding_bulkrnabert-seed17/checkpoints/best.pt
      metrics:
        train_cpg_x_val_sample: {mas_pcc: 0.5795, mac_pcc: 0.9515, mse: 0.0145, mae: 0.0753}
        val_cpg_x_train_sample: {mas_pcc: 0.5321, mac_pcc: 0.9466, mse: 0.0156, mae: 0.0758}
        val_cpg_x_val_sample:   {mas_pcc: 0.5164, mac_pcc: 0.9465, mse: 0.0158, mae: 0.0765}
      verdict: underperforms cross-attention reference, larger gap than bottleneck_mlp; not promoted.
    chr123:
      status: queued   # launched on this host 2026-09-07, chained after B.6 source ablation
      run_id: arch-architecture_novelty_2026_09-shared-enc_frozen_embedding_bulkrnabert-chr123-seed17
      checkpoint: MethylPredictionData/experiments/runs/locus_cls_joint/chr123/arch-architecture_novelty_2026_09-shared-enc_frozen_embedding_bulkrnabert-chr123-seed17/checkpoints/best.pt
      metrics: null
      note: launched so it can merge with the other machine's chr1+chr123 gene_pathway/bulkformer_147m runs on next push.

  - arm: gene_pathway
    description: >
      Trainable SurvPath-style biologically sparse gene→pathway encoder (our own implementation,
      NOT MethylProphet's gene-pathway variant from Table 9 -- see paper/table9_rna_encoder_ablation.md).
    recipe: configs/models/rna_encoder_comparison/enc_gene_pathway.yaml
    chr1:
      status: in_progress_remote   # launched on a second machine 2026-09-07, per the user
      run_id_dev: rnaenc-gene_pathway-development-seed17   # dev-only number below, official run now in progress elsewhere
      checkpoint: null   # not on this host -- will arrive via git push from the other machine
      metrics_development_only:
        val_cpg_x_val_sample_inner: {mas_pcc: 0.5072}   # inner proxy split, NOT official -- do not cite as a paper number
    chr123:
      status: in_progress_remote   # launched on a second machine 2026-09-07, per the user
      checkpoint: null
      metrics: null
    next_step: >
      Nothing to launch here -- wait for the other machine's push. If it doesn't arrive, resume with:
      python scripts/experiments/run_rna_encoder_comparison.py --arms gene_pathway --mode final --gpu 0
      then python scripts/experiments/collect_rna_encoder_comparison.py --mode final (chr1 only --
      that script doesn't cover chr123, a chr123 run needs the same manual scripts/train.py +
      scripts/evaluate.py shape used for frozen_embedding_bulkrnabert's chr123 arm above).

  - arm: bulkformer_147m
    description: Frozen BulkFormer-147M sample embedding + trainable LayerNorm/Linear adapter.
    recipe: configs/models/rna_encoder_comparison/enc_frozen_bulkformer_147m.yaml
    chr1:
      status: in_progress_remote   # launched on a second machine 2026-09-07, per the user
      run_id_dev: rnaenc-bulkformer_147m-development-seed17
      checkpoint: null
      metrics_development_only:
        val_cpg_x_val_sample_inner: {mas_pcc: 0.4516}
    chr123:
      status: in_progress_remote   # launched on a second machine 2026-09-07, per the user
      checkpoint: null
      metrics: null
    next_step: >
      Nothing to launch here -- wait for the other machine's push (same caveat as gene_pathway
      above: run_rna_encoder_comparison.py only covers chr1; chr123 needs the manual command shape).

merge_note_2026_09_07: >
  Two machines are populating this file's chr123 column in parallel: the other machine covers
  gene_pathway + bulkformer_147m (both chr1 and chr123), this host covers
  frozen_embedding_bulkrnabert's chr123 cell. On the next `git pull` from the other machine's
  push, merge its numbers into the chr1/chr123 blocks above by hand (or accept its version of this
  file and re-apply this host's bulkrnabert-chr123 result if it isn't already included) -- do not
  let one side's push silently overwrite the other's already-closed cells.
