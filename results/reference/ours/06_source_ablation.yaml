finding: >
  Two robustness results worth their own sentences in the manuscript, not just a table:
  1. Array-only already gets 96% of the way to the full-data number (0.5608 / 0.5838), vs.
     MethylProphet's 67% (0.2597 / 0.3904) -- our architecture is far less dependent on the
     auxiliary EPIC/WGBS technologies.
  2. Adding WGBS to Array COLLAPSES MethylProphet's own model (0.2597 -> 0.0369, MAC-PCC
     0.7930 -> 0.1006) -- a real fragility in their published numbers. Ours does not collapse at
     all; it improves slightly (0.5608 -> 0.5661). EPIC helps more than WGBS for both models
     (consistent direction), but only MethylProphet is destabilized by WGBS specifically.
  Order for ours: array (0.5608) < array+wgbs (0.5661) < array+epic+wgbs (0.5838) ≈
  array+epic (0.5847, technically the single highest cell, though within noise of full-data) --
  EPIC carries essentially all the auxiliary-data benefit; WGBS adds almost nothing once EPIC is
  present, unlike for MethylProphet where WGBS is actively harmful.
  All four cells single-seed (17) -- same caveat as B.1's single_seed_caveat applies throughout.
