code_change: >
  Added an optional `sources`/`training_sources` parameter threaded through
  `load_matched_chr1_protocol_and_sources` (matched_chr1_data.py) ->
  `LocusCLSJointTrainer.__init__` (locus_cls_trainer.py) -> a new `--training-sources`
  CLI flag (scripts/train.py, comma-separated, e.g. "array" or "array,wgbs"). "array" is
  always implicitly included. Default (flag omitted) is unchanged from before this change
  (all three sources) -- every existing recipe/run is unaffected, verified two ways: (1) a
  direct CPU-only smoke test loading all 4 source combinations and checking protocol.sources/
  opened-file-keys/auxiliary_cpg_idx match expectations exactly, array_train_sample_idx
  identical (8260) across all combos; (2) the existing test suite
  (tests/test_optimized_pipeline.py, the only test file touching this code path) still passes,
  4/4. training_sources is recorded into config.resolved.yaml only when non-default (same
  preserve-compatibility convention as query_source), so resuming any pre-existing run is
  unaffected. Evaluation is untouched -- evaluate_official_split always evaluates on the true,
  unrestricted official split regardless of what a checkpoint was trained on (that's the whole
  point of a source ablation: same eval, different training data).
feasibility_note: >
  Verified directly in source (not inferred), 2026-09-07:
  1. `--engine matched_chr1_shared_backbone` (what B.1 uses): `load_matched_chr1_protocol_and_sources`
     (rna_training/matched_chr1_data.py) unconditionally opens and includes all three sources
     (`sources = {"array": ..., "epic": ..., "wgbs": ...}`, `MatchedChr1Protocol.sources` defaults
     to `("array","epic","wgbs")`) -- no parameter anywhere in this path selects a subset.
  2. `--engine shared_backbone` at `scope=chr1`: `scopes.py::scope_protocol("chr1", ...)`
     hardcodes `load_protocol("tcga_mix_chr1", ...)` -- always the all-three-sources protocol.
     `scripts/train.py` has no `--protocol` CLI flag to override this.
  3. `locus_cls.structured_loss_sources` in the recipe only reweights the loss per source
     (`loss_config_for_source`) -- confirmed it does not touch which sources' samples enter
     training at all.
  Real finding worth recording: the exact protocol DATA for the missing 3 conditions already
  exists on disk and needs no new data prep -- `datasets/methylprophet_repro_v1/protocols/
  {tcga_array_chr1,tcga_array_epic_chr1,tcga_array_wgbs_chr1}/` (alongside `tcga_mix_chr1`, the
  all-sources one already in use) are real, built protocol directories, just unreachable from any
  current CLI path. Unblocking this would need: either a `--protocol` override threaded through
  `scripts/train.py` -> `scope_protocol()`, or a source-subset parameter threaded through
  `load_matched_chr1_protocol_and_sources`. Both are small, targeted changes, not a new pipeline --
  worth flagging to whoever decides if "no new code" should flex for this one item, since the hard
  part (data) is already done.
  Per the paper plan's own explicit scope reduction ("escludendo... qualunque esperimento che
  richieda nuovo codice"), this item stays deferred, not attempted, until that decision is made.
