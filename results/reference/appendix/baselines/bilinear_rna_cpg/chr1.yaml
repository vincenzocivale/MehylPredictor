status: reference
model: bilinear_rna_cpg
architecture: VarianceNormalizedResidualModel, interaction.kind=bilinear, include_rna=false, include_cpg=false (BilinearInteraction, bilinear term only)
training_scope: chr1
seed: 17
training:
  learning_rate: 5.0e-5
  scheduler: constant
  epochs: 80
  array_batch: [512, 512]
  sources: [array, epic, wgbs]
evaluation:
  chr1:
    train_cpg_x_val_sample: {mas_pcc: 0.5780, mse: 0.01440}
    val_cpg_x_train_sample: {mas_pcc: 0.5692, mse: 0.01985}
    val_cpg_x_val_sample: {mas_pcc: 0.5273, mse: 0.02043}
benchmark_role: baseline vs. MethylProphet-matched chromosome-1 comparison
note: >
  "Bilinear RNA-CpG" baseline (docs/PAPER_EXPERIMENTS.md): RNA and CpG features
  projected into a shared latent space, interaction modeled via a low-rank dot
  product only (include_rna=include_cpg=false, so the joint MLP head sees only
  the bilinear term). Notably strong for a simplified baseline: val-CpG x
  val-sample MAS-PCC 0.5273, close to the canonical model's 0.5613
  (results/reference/rna_methylation/chr1.yaml) and well above MethylProphet's
  own published number (0.3904) on the same view -- a simple low-rank
  interaction captures most of the canonical architecture's skill on chr1.
