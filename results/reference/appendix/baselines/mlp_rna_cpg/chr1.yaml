status: reference
model: mlp_rna_cpg
architecture: VarianceNormalizedResidualModel, interaction.kind=concat, include_product=false (ProductInteraction, no explicit interaction term)
training_scope: chr1
seed: 17
training:
  learning_rate: 5.0e-5
  scheduler: constant
  epochs: 80
  array_batch: [512, 512]
  sources: [array, epic, wgbs]
evaluation:
  chr1:
    train_cpg_x_val_sample: {mas_pcc: 0.5651, mse: 0.01471}
    val_cpg_x_train_sample: {mas_pcc: 0.5613, mse: 0.01961}
    val_cpg_x_val_sample: {mas_pcc: 0.5198, mse: 0.02014}
benchmark_role: baseline vs. MethylProphet-matched chromosome-1 comparison
note: >
  "MLP RNA-CpG" baseline (docs/PAPER_EXPERIMENTS.md): RNA and CpG representations
  combined through a generic multilayer perceptron -- include_product=false drops
  the explicit proj(rna) * proj(cpg) interaction term, so the joint MLP input is
  only [rna, cpg]. First training attempt was blocked by a since-fixed config
  guard in benchmark/methylprophet/config.py::load_config that retired
  interaction.include_product after an earlier, unrelated ablation
  (interaction_concat_and_latent_dim_2026_08); re-permitted specifically for
  this formal baseline. Notably strong for a simplified baseline: val-CpG x
  val-sample MAS-PCC 0.5198, close to Bilinear RNA-CpG (0.5273) and the
  canonical model (0.5613, results/reference/rna_methylation/chr1.yaml), and
  well above MethylProphet's own published number (0.3904) -- a generic
  nonlinear fusion without an explicit interaction term still captures most of
  the canonical architecture's skill on chr1.
