model:
  encoder:
    kind: locus_attention
    latent_dim: 256
    n_programs: 64
    program_dim: 256
    n_heads: 4
    dropout: 0.1
    layer_norm: true
  interaction:
    kind: concat
    hidden_dim: 128
    dropout: 0.1
  zero_init_residual: true
  variance_normalized_residual: true
  functional_fusion_variant: mas_concat_v3_purecontext
loss:
  beta_mse_weight: 1.0
  residual_huber_weight: 0.0
  shrinkage_weight: 0.0
  standardized_residual_huber_weight: 0.0
  standardized_shrinkage_weight: 0.0
  locus_pearson_weight: 0.15
  locus_min_observed_samples: 8
  sample_pearson_weight: 0.0
  locus_centered_mse_weight: 0.0
training:
  seed: 17
  device: auto
  epochs: 80
  steps_per_epoch: 250
  sample_batch_size: 32
  cpg_batch_size: 256
  learning_rate: 0.0002
  weight_decay: 0.0001
  scheduler: cosine_warmup
  scheduler_horizon_epochs: 80
  warmup_epochs: 1.0
  min_lr_ratio: 0.1
  gradient_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
  allow_tf32: true
  matmul_precision: high
  fused_adamw: true
  patience: 15
  min_delta: 1.0e-05
  num_workers: 0
  schedule_layout: contiguous_blocks
  prefetch_depth: 8
  prefetch_workers: 4
  hdf5_cache_mb: 256
  checkpoint_every: 1
  compile: false
  compile_mode: default
  validation_sample_split: validation
  validation_cpg_split: validation
  train_sample_split: train
  train_cpg_split: train
  checkpoint_metric: mse
  checkpoint_min_global_skill: null
  checkpoint_min_amplitude_ratio: null
  checkpoint_max_amplitude_ratio: null
  validation_every: 1
  validation_max_cpgs: 512
  min_epochs: 0
  save_every_epoch: false
  cpg_sampling: uniform
  checkpoint_selection: best
  residual_learning_rate: null
  warm_start_checkpoint: null
  freeze_backbone_epochs: 0
  freeze_warm_start_params: false
  seed_initial_checkpoint: false
schedule_policy: pair_complete
exclude_official_val_from_auxiliary: true
structured_loss_sources:
- array
- epic
- wgbs
locus_cls:
  use_mean_branch: true
  use_fusion_product: false
  use_raw_product: true
  product_mlp: false
  include_raw_rna: true
  include_raw_cpg: true
  fusion_init_std: 0.01
  aux_weight: 0.15
  residual_aux_weight: 0.0
  raw_lr_multiplier: 1.0
  trunk_hidden_dim: 256
  bottleneck_dim: 64
batching:
  array:
    sample_size: 640
    cpg_size: 640
  epic:
    sample_size: 160
    cpg_size: 5120
  wgbs:
    sample_size: 32
    cpg_size: 20480
development:
  fraction: 0.1
  block_bp: 5000000
  split_seed: 17
tracking:
  backend: wandb
  project: MethylPredictor
  mode: online
  group: functional_concat_final
  job_type: train
  tags:
  - functional-only
  - mas-concat
  - purecontext
  - chr1-final
functional_locus:
  functional_atlas: /dune/DATASETS/MethylPredictionData/derived/ntv3_functional_peak_atlas_chr1_all_sources
  annotation_cache: /dune/DATASETS/MethylPredictionData/derived/ntv3_probe_targets/chr1_annotation_features_all_sources
  n_tracks: 4165
  dense_dim: 23
  encoder_dim: 256
  fusion_variant: mas_concat_v3_purecontext
  residual_policy: random_initialized_functional_projection
  mode: functional_only
