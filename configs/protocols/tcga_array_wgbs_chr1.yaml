# Array + WGBS auxiliary training data, chr1. Array split is the exact
# released evaluation protocol; WGBS has no held-out split (training-only
# auxiliary source, no official WGBS evaluation panel).
protocol: tcga_array_wgbs_chr1
source_sampling:
  policy: explicit_balanced
  weights:
    array: 1.0
    wgbs: 1.0
batch:
  sample_size: 32
  cpg_size: 256
