# Source-mixing ablation: proportional-to-measurements. Weight = training
# pool row count per source (8,260 array train measurements; 1,706 EPIC;
# 32 WGBS), computed at load time by Protocol._resolve_weights -- no
# `weights` block here (the policy rejects one; sizes come from the pools
# themselves). In practice this means Array dominates almost every draw.
protocol: tcga_mix_chr1
source_sampling:
  policy: proportional_to_measurements
batch:
  sample_size: 32
  cpg_size: 256
