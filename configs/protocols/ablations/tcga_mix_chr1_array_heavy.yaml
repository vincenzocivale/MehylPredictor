# Source-mixing ablation: array-heavy. Array carries the official
# evaluation ground truth, so this weights it above the auxiliary
# (no-held-out) EPIC/WGBS sources: 50% array, 25% each EPIC/WGBS. An
# illustrative, arbitrary-but-named choice -- adjust freely, it's the point
# of making this an explicit ablation axis rather than one hardcoded ratio.
protocol: tcga_mix_chr1
source_sampling:
  policy: explicit_balanced
  weights:
    array: 0.50
    epic: 0.25
    wgbs: 0.25
batch:
  sample_size: 32
  cpg_size: 256
