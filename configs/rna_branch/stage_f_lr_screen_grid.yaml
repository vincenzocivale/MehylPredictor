# Stage F LR screen: cheap, validation-only pass (5 epochs, 100 steps/epoch,
# capped eval) over 3 learning rates for each of the 4 first-tranche fusion
# mechanisms, single seed. Picks a learning rate per family before the full
# first-tranche run -- not itself a scientific result.
base_config: stage_f_base.yaml
runs:
- name: f0_bilinear_lr2e5_seed17
  override:
    model: &f0
      encoder:
        kind: linear
      interaction:
        kind: bilinear
    training:
      seed: 17
      epochs: 5
      min_epochs: 0
      steps_per_epoch: 100
      learning_rate: 2.0e-05
      patience: 100
      validation_max_cpgs: 512
    evaluation:
      max_cpgs_per_panel: 512
    output_dir: artifacts/rna_branch/stage_f_fusion/lr_screen/default
- name: f0_bilinear_lr1e4_seed17
  override:
    model: *f0
    training:
      seed: 17
      epochs: 5
      min_epochs: 0
