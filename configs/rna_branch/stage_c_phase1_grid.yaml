# Materialize only after the Phase-0 validation protocol is chosen.  C3 is
# intentionally not included here until its training-only centroid contract is
# implemented; this prevents an accidental leakage-prone run.
base_config: stage_c_base.yaml
runs:
  - {name: c0_seed17, override: {training: {seed: 17}}}
  - {name: c0_seed29, override: {training: {seed: 29}}}
  - {name: c0_seed43, override: {training: {seed: 43}}}
  - {name: c1_mlp128_32_seed17, override: {model: {interaction: {kind: interaction_mlp, mlp_hidden_dims: [128, 32]}}, training: {seed: 17}}}
  - {name: c1_mlp128_32_seed29, override: {model: {interaction: {kind: interaction_mlp, mlp_hidden_dims: [128, 32]}}, training: {seed: 29}}}
  - {name: c1_mlp128_32_seed43, override: {model: {interaction: {kind: interaction_mlp, mlp_hidden_dims: [128, 32]}}, training: {seed: 43}}}
  - {name: c1_mlp64_seed17, override: {model: {interaction: {kind: interaction_mlp, mlp_hidden_dims: [64]}}, training: {seed: 17}}}
  - {name: c1_mlp64_seed29, override: {model: {interaction: {kind: interaction_mlp, mlp_hidden_dims: [64]}}, training: {seed: 29}}}
  - {name: c1_mlp64_seed43, override: {model: {interaction: {kind: interaction_mlp, mlp_hidden_dims: [64]}}, training: {seed: 43}}}
  - {name: c2_k4_seed17, override: {model: {interaction: {kind: multihead_bilinear, hidden_dim: 64, num_heads: 4}}, training: {seed: 17}}}
  - {name: c2_k4_seed29, override: {model: {interaction: {kind: multihead_bilinear, hidden_dim: 64, num_heads: 4}}, training: {seed: 29}}}
  - {name: c2_k4_seed43, override: {model: {interaction: {kind: multihead_bilinear, hidden_dim: 64, num_heads: 4}}, training: {seed: 43}}}
  - {name: c2_k8_seed17, override: {model: {interaction: {kind: multihead_bilinear, hidden_dim: 64, num_heads: 8}}, training: {seed: 17}}}
  - {name: c2_k8_seed29, override: {model: {interaction: {kind: multihead_bilinear, hidden_dim: 64, num_heads: 8}}, training: {seed: 29}}}
  - {name: c2_k8_seed43, override: {model: {interaction: {kind: multihead_bilinear, hidden_dim: 64, num_heads: 8}}, training: {seed: 43}}}
