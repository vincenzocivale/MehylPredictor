run_name: tcga_genome_wide_concat_seed41
output_dir: artifacts/rna_branch/tcga_genome_wide_concat/seed41

data:
  rna:
    path: /data/dataset/methylation/genomic_encoder_genome_wide_scratch/rna_branch_inputs/tcga_rna.h5
    values_key: X
    row_ids_key: sample_idx
    col_ids_key: gene_ids
  methylation:
    path: /data/dataset/methylation/genomic_encoder_genome_wide_scratch/rna_branch_inputs/tcga_genome_wide_beta.h5
    values_key: beta
    row_ids_key: sample_idx
    col_ids_key: cpg_idx
  locus_embeddings:
    path: /data/dataset/methylation/genomic_encoder_genome_wide_scratch/rna_branch_inputs/locus_embeddings.h5
    values_key: embeddings
    row_ids_key: cpg_idx
  locus_features:
    path: /data/dataset/methylation/genomic_encoder_genome_wide_scratch/rna_branch_inputs/locus_features.parquet
    id_column: cpg_idx
  sample_metadata:
    path: /data/dataset/methylation/genomic_encoder_genome_wide_scratch/rna_branch_inputs/sample_metadata.parquet
    id_column: sample_idx
  cpg_splits:
    path: /data/dataset/methylation/genomic_encoder_genome_wide_scratch/rna_branch_inputs/cpg_split_manifest.parquet
    id_column: cpg_idx
  rna_control: real
  standardize_rna: true
  clip_beta_epsilon: 1.0e-4

model:
  encoder:
    kind: linear
    latent_dim: 64
    layer_norm: true
  interaction:
    kind: concat
    hidden_dim: 128
    dropout: 0.1
  gate:
    kind: variability
    hidden_dim: 64
    dropout: 0.0
  anchor_to_mean_rna: true
  zero_init_residual: true

loss:
  beta_mse_weight: 1.0
  residual_huber_weight: 0.1
  residual_huber_delta: 1.0
  shrinkage_weight: 1.0e-4

training:
  seed: 41
  device: auto
  epochs: 50
  min_epochs: 10
  steps_per_epoch: 64
  sample_batch_size: 64
  cpg_batch_size: 2048
  cpg_sampling: uniform
  learning_rate: 2.0e-5
  weight_decay: 1.0e-4
  gradient_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
  allow_tf32: true
  matmul_precision: high
  fused_adamw: true
  patience: 10
  min_delta: 1.0e-5
  checkpoint_metric: mse
  validation_every: 1
  validation_max_cpgs: 1024
  save_every_epoch: false

evaluation:
  # ConcatInteraction is NOT factorized/cacheable (unlike bilinear): every
  # forward pass materializes [sample_chunk, cpg_chunk, 1664] in full. Real
  # train_cpg is now ~327k CpGs (was 5,243) -- keep the small chunk sizes
  # from the chr1-scale concat run (128x512x1664x4B~=436MB/chunk) or this
  # would OOM a 12GB GPU, now touching many more chunks for in_distribution/
  # sample_ood panels (slower, but memory-safe).
  sample_chunk_size: 128
  cpg_chunk_size: 512
  max_cpgs_per_panel: null
  save_predictions: false
  panels:
    in_distribution:
      sample_split: train
      cpg_split: train
    sample_ood:
      sample_split: test
      cpg_split: train
    locus_ood:
      sample_split: train
      cpg_split: test
    double_ood:
      sample_split: test
      cpg_split: test

tracking:
  # Disabled to match the frozen bilinear seed17 config exactly (the only
  # intended difference between the two runs is model.interaction.kind).
  backend: none
