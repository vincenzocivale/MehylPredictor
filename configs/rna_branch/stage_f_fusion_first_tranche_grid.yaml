# Stage F first tranche: fusion (not encoding) ablation. Encoder A0 (linear,
# latent_dim 64) is fixed and frozen NTv3 prior is unchanged; only the RNA-locus
# fusion mechanism varies. Learning rate here is the Stage E2.5 default
# (1e-4, inherited from stage_f_base.yaml) -- rerun with a different rate per
# family first if stage_f_lr_screen_grid.yaml flags a better one.
#
# Exactly 4 scientific runs, single seed:
#   F0 bilinear C0            -- bit-exact control, same as the Stage E2/E2.5 anchor.
#   F2 concat + explicit product (z, g~, z*g~) -- minimal joint nonlinearity.
#   F3 FiLM, locus-conditioned (locus generates gamma/eta over the RNA vector).
#   F4 linear multi-token (K=4, d=16) + single-block locus-query cross attention,
#      no self-attention, no transformer stack.
#
# F1 (concat + MLP, no explicit product) is deliberately skipped: F2 already
# contains the concatenation and adds the interaction term, so F1 gives F2 no
# room to fail against a strictly weaker baseline. Do NOT add other seeds,
# wider K/d for F4, or additional fusion mechanisms here.
base_config: stage_f_base.yaml
runs:
- name: f0_bilinear_c0_seed17
  override:
    model:
      encoder:
        kind: linear
      interaction:
        kind: bilinear
    training:
      seed: 17
      save_every_epoch: true
    evaluation:
      save_predictions: true
    output_dir: artifacts/rna_branch/stage_f_fusion/first_tranche/default
- name: f2_concat_product_seed17
  override:
    model:
      encoder:
        kind: linear
      interaction:
        kind: concat
    training:
      seed: 17
      save_every_epoch: true
    evaluation:
      save_predictions: true
    output_dir: artifacts/rna_branch/stage_f_fusion/first_tranche/default
- name: f3_film_locus_seed17
  override:
    model:
      encoder:
        kind: linear
      interaction:
        kind: film_locus
    training:
      seed: 17
      save_every_epoch: true
    evaluation:
      save_predictions: true
    output_dir: artifacts/rna_branch/stage_f_fusion/first_tranche/default
- name: f4_linear_tokens_cross_attn_seed17
  override:
    model:
      encoder:
        kind: linear_tokens
        token_dim: 16
        num_latents: 4
      interaction:
        kind: linear_token_cross_attention
    training:
      seed: 17
      save_every_epoch: true
    evaluation:
      save_predictions: true
    output_dir: artifacts/rna_branch/stage_f_fusion/first_tranche/default
