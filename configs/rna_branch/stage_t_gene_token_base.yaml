# Stage T: one semantic token per gene.  This base deliberately preserves the
# Stage-F training/data/loss contract and uses production F2 as the downstream
# interaction unless an explicitly separate locus-query tranche is authorized.
run_name: stage_t_gene_tokens
output_dir: artifacts/rna_branch/stage_t_gene_tokens/default
data:
  rna: {path: artifacts/rna_branch/2026-07-29_first_benchmark/inputs/tcga_rna.h5, values_key: X, row_ids_key: sample_idx, col_ids_key: gene_ids}
  methylation: {path: artifacts/rna_branch/2026-07-29_first_benchmark/inputs/tcga_chr1_beta.h5, values_key: beta, row_ids_key: sample_idx, col_ids_key: cpg_idx}
  locus_embeddings: {path: artifacts/rna_branch/2026-07-29_first_benchmark/inputs/locus_embeddings.h5, values_key: embeddings, row_ids_key: cpg_idx}
  locus_features: {path: artifacts/rna_branch/2026-07-29_first_benchmark/inputs/locus_features.parquet, id_column: cpg_idx}
  sample_metadata: {path: artifacts/rna_branch/2026-07-29_first_benchmark/inputs/sample_metadata.parquet, id_column: sample_idx}
  cpg_splits: {path: artifacts/rna_branch/2026-07-29_first_benchmark/inputs/cpg_split_manifest.parquet, id_column: cpg_idx}
  gene_embeddings: {path: artifacts/rna_branch/stage_t_gene_tokens/inputs/ntv3_gene_embeddings.npz, values_key: embeddings, row_ids_key: gene_ids}
  rna_control: real
  standardize_rna: true
model:
  encoder:
    kind: gene_token_perceiver
    latent_dim: 64
    token_dim: 64
    num_latents: 16
    num_heads: 4
    num_self_attention_blocks: 0
    value_encoding: linear
    gene_token_fusion: film
    gene_identity_source: learned
    gene_embedding_permutation_seed: 20260730
    freeze_gene_embeddings: true
    dropout: 0.1
    layer_norm: true
  # Keep the exact production F2 representation during the first tranche.
  interaction: {kind: concat, hidden_dim: 128, dropout: 0.1, num_heads: 4}
  gate: {kind: variability, hidden_dim: 64, dropout: 0.0}
  anchor_to_mean_rna: true
  zero_init_residual: true
loss: {beta_mse_weight: 1.0, residual_huber_weight: 0.1, residual_huber_delta: 1.0, shrinkage_weight: 0.0001}
training:
  seed: 17
  device: auto
  epochs: 20
  min_epochs: 10
  steps_per_epoch: 250
  sample_batch_size: 32  # scientific invariant; reduce only with explicit gradient accumulation.
  cpg_batch_size: 256
  learning_rate: 0.0001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  amp: true
  patience: 100
  checkpoint_metric: mse
  validation_every: 1
  validation_max_cpgs: 512
  save_every_epoch: true
evaluation:
  sample_chunk_size: 32
  cpg_chunk_size: 256
  max_cpgs_per_panel: 1024
  save_predictions: true
