# Stage E2.5-A: nested, cancer-type-stratified patient-count scaling.
# fraction=1.0 points are NOT included here -- they are exactly the existing
# Stage E2 confirm runs (a0_linear_seed{17,23,41}, a3_gated_residual_w256_seed{17,23,41}),
# reused as the anchor point for both encoders rather than rerun.
base_config: e2_5_base.yaml
runs:
- name: e2_5a_a0_linear_frac25_seed17
  override:
    model: &a0
      encoder:
        kind: linear
    data:
      train_sample_fraction: 0.25
    training:
      seed: 17
    output_dir: artifacts/rna_branch/stage_e2_5/patient_scaling/default
- name: e2_5a_a0_linear_frac25_seed23
  override:
    model: *a0
    data:
      train_sample_fraction: 0.25
    training:
