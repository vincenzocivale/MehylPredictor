# Learning rates below are the Phase-2 lr_screen winners (all six families
# picked lr=1e-4; see artifacts/rna_branch/stage_e2_encoder/lr_screen_report.csv).
base_config: e2_encoder_base.yaml
runs:
- name: a0_linear_seed17
  override:
    model: &id001
      encoder:
        kind: linear
    training:
      seed: 17
      learning_rate: 0.0001
    output_dir: artifacts/rna_branch/stage_e2_encoder/confirm/default
- name: a0_linear_seed23
  override:
    model: *id001
    training:
      seed: 23
      learning_rate: 0.0001
    output_dir: artifacts/rna_branch/stage_e2_encoder/confirm/default
- name: a0_linear_seed41
  override:
    model: *id001
    training:
      seed: 41
      learning_rate: 0.0001
    output_dir: artifacts/rna_branch/stage_e2_encoder/confirm/default
- name: a1_mp_b6w512_seed17
  override:
    model: &id002
      encoder:
        kind: bottleneck_mlp
        width: 512
        num_blocks: 6
        expansion_factor: 4
    training:
      seed: 17
      learning_rate: 0.0001
    output_dir: artifacts/rna_branch/stage_e2_encoder/confirm/default
- name: a1_mp_b6w512_seed23
  override:
    model: *id002
    training:
