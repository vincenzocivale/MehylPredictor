# Stage E2 first tranche (see docs/rna_encoder_stage_e2.md, section "First tranche").
# Exactly 5 scientific runs: A0 linear-C0 baseline (paired reference) plus
# A2 linear_residual and A3 gated_residual at two learning rates each, all at
# the C0 seed. Everything except model.encoder and training.learning_rate is
# inherited unchanged from e2_encoder_base.yaml (== c0_v0_final.yaml).
#
# Do NOT add A1/A4/A5, other seeds, width/dropout/latent sweeps, or additional
# fusion mechanisms here -- those are out of scope for the first tranche.
base_config: e2_encoder_base.yaml
runs:
- name: a0_linear_c0_seed17
  override:
    model:
      encoder:
        kind: linear
    training:
      seed: 17
      learning_rate: 2.0e-05
      save_every_epoch: true
    evaluation:
      save_predictions: true
    output_dir: artifacts/rna_branch/stage_e2_encoder/first_tranche/default
- name: a2_linear_residual_w256_lr1e4_seed17
  override:
    model:
      encoder:
        kind: linear_residual
        width: 256
        num_blocks: 1
    training:
      seed: 17
      learning_rate: 1.0e-04
      save_every_epoch: true
    evaluation:
      save_predictions: true
    output_dir: artifacts/rna_branch/stage_e2_encoder/first_tranche/default
- name: a2_linear_residual_w256_lr3e4_seed17
  override:
    model:
      encoder:
        kind: linear_residual
        width: 256
        num_blocks: 1
    training:
      seed: 17
      learning_rate: 3.0e-04
      save_every_epoch: true
    evaluation:
      save_predictions: true
    output_dir: artifacts/rna_branch/stage_e2_encoder/first_tranche/default
- name: a3_gated_residual_w256_lr1e4_seed17
  override:
    model:
      encoder:
        kind: gated_residual
        width: 256
        num_blocks: 1
    training:
      seed: 17
      learning_rate: 1.0e-04
      save_every_epoch: true
    evaluation:
      save_predictions: true
    output_dir: artifacts/rna_branch/stage_e2_encoder/first_tranche/default
- name: a3_gated_residual_w256_lr3e4_seed17
  override:
    model:
      encoder:
        kind: gated_residual
        width: 256
        num_blocks: 1
    training:
      seed: 17
      learning_rate: 3.0e-04
      save_every_epoch: true
    evaluation:
      save_predictions: true
    output_dir: artifacts/rna_branch/stage_e2_encoder/first_tranche/default
