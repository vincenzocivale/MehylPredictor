run_name: tcga_matrix_concat_seed41
output_dir: artifacts/rna_branch/tcga_matrix_concat/seed41

data:
  rna:
    path: artifacts/rna_branch/2026-07-29_first_benchmark/inputs/tcga_rna.h5
    values_key: X
    row_ids_key: sample_idx
    col_ids_key: gene_ids
  methylation:
    path: artifacts/rna_branch/2026-07-29_first_benchmark/inputs/tcga_chr1_beta.h5
    values_key: beta
    row_ids_key: sample_idx
    col_ids_key: cpg_idx
  locus_embeddings:
    path: artifacts/rna_branch/2026-07-29_first_benchmark/inputs/locus_embeddings.h5
    values_key: embeddings
    row_ids_key: cpg_idx
  locus_features:
    path: artifacts/rna_branch/2026-07-29_first_benchmark/inputs/locus_features.parquet
    id_column: cpg_idx
  sample_metadata:
    path: artifacts/rna_branch/2026-07-29_first_benchmark/inputs/sample_metadata.parquet
    id_column: sample_idx
  cpg_splits:
    path: artifacts/rna_branch/2026-07-29_first_benchmark/inputs/cpg_split_manifest.parquet
    id_column: cpg_idx
  rna_control: real
  standardize_rna: true
  clip_beta_epsilon: 1.0e-4

model:
  encoder:
    kind: linear
    latent_dim: 64
    layer_norm: true
  interaction:
    # F2 (Stage F/G winner) -- see docs/tcga_matrix_model.md "Interaction
    # choice" for the caveats (validated at 3 seeds on validation MSE, not
    # yet robust under a hierarchical bootstrap) and the memory caveat (not
    # factorized -- eval chunk sizes below are shrunk accordingly).
    kind: concat
    hidden_dim: 128
    dropout: 0.1
  gate:
    kind: variability
    hidden_dim: 64
    dropout: 0.0
  anchor_to_mean_rna: true
  zero_init_residual: true

loss:
  beta_mse_weight: 1.0
  residual_huber_weight: 0.1
  residual_huber_delta: 1.0
  shrinkage_weight: 1.0e-4

training:
  seed: 41
  device: auto
  epochs: 50
  min_epochs: 10
  steps_per_epoch: 64
  sample_batch_size: 64
  cpg_batch_size: 2048
  cpg_sampling: uniform
  learning_rate: 2.0e-5
  weight_decay: 1.0e-4
  gradient_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
  allow_tf32: true
  matmul_precision: high
  fused_adamw: true
  patience: 10
  min_delta: 1.0e-5
  checkpoint_metric: mse
  validation_every: 1
  validation_max_cpgs: 1024
  save_every_epoch: false

evaluation:
  # ConcatInteraction is not factorized/cacheable: every forward pass
  # materializes [batch, n_loci, rna_dim+locus_dim+min(rna_dim,locus_dim)]
  # = [batch, n_loci, 1664] in full. The bilinear-tuned defaults
  # (1024 x 8192) would materialize ~56GB and OOM a 12GB GPU; these values
  # keep the largest chunk under ~450MB.
  sample_chunk_size: 128
  cpg_chunk_size: 512
  max_cpgs_per_panel: null
  save_predictions: false
  panels:
    in_distribution:
      sample_split: train
      cpg_split: train
    sample_ood:
      sample_split: test
      cpg_split: train
    locus_ood:
      sample_split: train
      cpg_split: test
    double_ood:
      sample_split: test
      cpg_split: test

tracking:
  backend: wandb
  project: MethylationPredictor
  group: tcga-matrix-concat
  name: tcga-matrix-concat-seed41
  job_type: train
  tags: [tcga, chr1, ntv3, rna, concat, f2, factorized-screen]
  mode: online
  log_every_steps: 10
  watch_model: false
  log_checkpoint: true
