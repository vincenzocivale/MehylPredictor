run_name: concat-genomewide-fullcoverage-seed17-v1
output_dir: artifacts/rna_branch/concat_genomewide_fullcoverage_seed17_v1/final_refit
data:
  rna:
    path: /data/dataset/methylation/genomic_encoder_genome_wide_scratch/rna_branch_inputs/tcga_rna.h5
    values_key: X
    row_ids_key: sample_idx
    col_ids_key: gene_ids
  methylation:
    path: /data/dataset/methylation/genomic_encoder_genome_wide_scratch/rna_branch_inputs/tcga_genome_wide_beta.h5
    values_key: beta
    row_ids_key: sample_idx
    col_ids_key: cpg_idx
  locus_embeddings:
    path: /data/dataset/methylation/genomic_encoder_genome_wide_scratch/rna_branch_inputs/locus_embeddings.h5
    values_key: embeddings
    row_ids_key: cpg_idx
  locus_features:
    path: /data/dataset/methylation/genomic_encoder_genome_wide_scratch/rna_branch_inputs/locus_features.parquet
    id_column: cpg_idx
  sample_metadata:
    path: /data/dataset/methylation/genomic_encoder_genome_wide_scratch/rna_branch_inputs/sample_metadata.parquet
    id_column: sample_idx
  cpg_splits:
    path: /data/dataset/methylation/genomic_encoder_genome_wide_scratch/rna_branch_inputs/cpg_split_manifest.parquet
    id_column: cpg_idx
  rna_control: real
  standardize_rna: true
  clip_beta_epsilon: 0.0001
model:
  encoder:
    kind: linear
    latent_dim: 64
    layer_norm: true
  interaction:
    kind: concat
    hidden_dim: 128
    dropout: 0.1
  gate:
    kind: variability
    hidden_dim: 64
    dropout: 0.0
  anchor_to_mean_rna: true
  zero_init_residual: true
loss:
  beta_mse_weight: 1.0
  residual_huber_weight: 0.1
  residual_huber_delta: 1.0
  shrinkage_weight: 0.0001
training:
  seed: 17
  device: auto
  epochs: 45
  min_epochs: 45
  steps_per_epoch: 64
  sample_batch_size: 64
  cpg_batch_size: 2048
  cpg_sampling: full_coverage
  learning_rate: 2.0e-05
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
  allow_tf32: true
  matmul_precision: high
  fused_adamw: true
  patience: 45
  min_delta: 1.0e-05
  checkpoint_metric: mse
  checkpoint_selection: final
  validation_every: 1000000
  validation_sample_split: train
  validation_cpg_split: train
  train_sample_split: train
  train_cpg_split: train
  validation_max_cpgs: 1024
  save_every_epoch: false
evaluation:
  sample_chunk_size: 128
  cpg_chunk_size: 512
  max_cpgs_per_panel: null
  save_predictions: false
  panels: {}
tracking:
  backend: wandb
  project: MethylationPredictor
  group: tcga-matrix-genomewide-fullcoverage
  name: concat-genomewide-fullcoverage-seed17-final
  job_type: train
  tags:
  - concat
  - genome-wide
  - full-coverage
  - seed17
  - stage-3b-final-refit
  log_every_steps: 25
  watch_model: false
  log_checkpoint: false
