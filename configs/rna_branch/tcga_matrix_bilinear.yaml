run_name: tcga_matrix_bilinear_seed17
output_dir: artifacts/rna_branch/tcga_matrix_bilinear/seed17

data:
  rna:
    path: artifacts/rna_branch/2026-07-29_first_benchmark/inputs/tcga_rna.h5
    values_key: X
    row_ids_key: sample_idx
    col_ids_key: gene_ids
  methylation:
    path: artifacts/rna_branch/2026-07-29_first_benchmark/inputs/tcga_chr1_beta.h5
    values_key: beta
    row_ids_key: sample_idx
    col_ids_key: cpg_idx
  locus_embeddings:
    path: artifacts/rna_branch/2026-07-29_first_benchmark/inputs/locus_embeddings.h5
    values_key: embeddings
    row_ids_key: cpg_idx
  locus_features:
    path: artifacts/rna_branch/2026-07-29_first_benchmark/inputs/locus_features.parquet
    id_column: cpg_idx
  sample_metadata:
    path: artifacts/rna_branch/2026-07-29_first_benchmark/inputs/sample_metadata.parquet
    id_column: sample_idx
  cpg_splits:
    path: artifacts/rna_branch/2026-07-29_first_benchmark/inputs/cpg_split_manifest.parquet
    id_column: cpg_idx
  rna_control: real
  standardize_rna: true
  clip_beta_epsilon: 1.0e-4

model:
  encoder:
    kind: linear
    latent_dim: 64
    layer_norm: true
  interaction:
    kind: bilinear
    hidden_dim: 128
    dropout: 0.1
  gate:
    kind: variability
    hidden_dim: 64
    dropout: 0.0
  anchor_to_mean_rna: true
  zero_init_residual: true

loss:
  beta_mse_weight: 1.0
  residual_huber_weight: 0.1
  residual_huber_delta: 1.0
  shrinkage_weight: 1.0e-4

training:
  seed: 17
  device: auto
  epochs: 50
  min_epochs: 10
  steps_per_epoch: 64
  sample_batch_size: 64
  cpg_batch_size: 2048
  cpg_sampling: uniform
  learning_rate: 2.0e-5
  weight_decay: 1.0e-4
  gradient_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
  allow_tf32: true
  matmul_precision: high
  fused_adamw: true
  patience: 10
  min_delta: 1.0e-5
  checkpoint_metric: mse
  validation_every: 1
  validation_max_cpgs: 1024
  save_every_epoch: false

evaluation:
  sample_chunk_size: 1024
  cpg_chunk_size: 8192
  max_cpgs_per_panel: null
  save_predictions: false
  panels:
    in_distribution:
      sample_split: train
      cpg_split: train
    sample_ood:
      sample_split: test
      cpg_split: train
    locus_ood:
      sample_split: train
      cpg_split: test
    double_ood:
      sample_split: test
      cpg_split: test

tracking:
  backend: wandb
  project: MethylationPredictor
  group: tcga-matrix-bilinear
  name: tcga-matrix-bilinear-seed17
  job_type: train
  tags: [tcga, chr1, ntv3, rna, bilinear, factorized]
  mode: online
  log_every_steps: 10
  watch_model: false
  log_checkpoint: true
