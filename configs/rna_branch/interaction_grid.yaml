base_config: base.yaml
runs:
  - name: mlp_bilinear_no_gate
    override:
      model:
        interaction:
          kind: bilinear
        gate:
          kind: none
  - name: mlp_bilinear_global_gate
    override:
      model:
        interaction:
          kind: bilinear
        gate:
          kind: global
  - name: mlp_bilinear_locus_gate
    override:
      model:
        interaction:
          kind: bilinear
        gate:
          kind: locus
  - name: mlp_bilinear_variability_gate
    override:
      model:
        interaction:
          kind: bilinear
        gate:
          kind: variability
  - name: mlp_concat_variability_gate
    override:
      model:
        interaction:
          kind: concat
        gate:
          kind: variability
  - name: mlp_film_variability_gate
    override:
      model:
        interaction:
          kind: film
        gate:
          kind: variability
  - name: perceiver_cross_attention_variability_gate
    override:
      model:
        encoder:
          kind: perceiver
          value_encoding: linear
        interaction:
          kind: cross_attention
        gate:
          kind: variability
