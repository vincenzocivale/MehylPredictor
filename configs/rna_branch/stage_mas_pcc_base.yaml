# Stage MAS-PCC: objective-alignment experiments on the established F2
# concat+product architecture. The loader already produces Cartesian
# samples x CpGs batches; this stage increases the sample axis because the
# per-locus Pearson estimate is the primary training signal.
run_name: stage_mas_pcc_default
output_dir: artifacts/rna_branch/stage_mas_pcc/screening/default

data:
  rna:
    path: artifacts/rna_branch/2026-07-29_first_benchmark/inputs/tcga_rna.h5
    values_key: X
    row_ids_key: sample_idx
    col_ids_key: gene_ids
  methylation:
    path: artifacts/rna_branch/2026-07-29_first_benchmark/inputs/tcga_chr1_beta.h5
    values_key: beta
    row_ids_key: sample_idx
    col_ids_key: cpg_idx
  locus_embeddings:
    path: artifacts/rna_branch/2026-07-29_first_benchmark/inputs/locus_embeddings.h5
    values_key: embeddings
    row_ids_key: cpg_idx
  locus_features:
    path: artifacts/rna_branch/2026-07-29_first_benchmark/inputs/locus_features.parquet
    id_column: cpg_idx
  sample_metadata:
    path: artifacts/rna_branch/2026-07-29_first_benchmark/inputs/sample_metadata.parquet
    id_column: sample_idx
  cpg_splits:
    path: artifacts/rna_branch/2026-07-29_first_benchmark/inputs/cpg_split_manifest.parquet
    id_column: cpg_idx
  rna_control: real
  standardize_rna: true

model:
  encoder:
    kind: linear
    latent_dim: 64
    layer_norm: true
    dropout: 0.1
  interaction:
    # Existing F2 implementation: concat of patient, locus, and product terms.
    kind: concat
    hidden_dim: 128
    dropout: 0.1
    num_heads: 8
  gate:
    kind: variability
    hidden_dim: 64
    dropout: 0.0
  anchor_to_mean_rna: true
  zero_init_residual: true

loss:
  beta_mse_weight: 1.0
  beta_huber_weight: 0.0
  beta_huber_delta: 0.05
  residual_huber_weight: 0.1
  residual_huber_delta: 1.0
  shrinkage_weight: 0.0001
  locus_pearson_weight: 0.0
  locus_lower_tail_weight: 0.0
  locus_lower_tail_fraction: 0.60
  locus_min_observed_samples: 32
  locus_pearson_epsilon: 1.0e-8
  pairwise_difference_weight: 0.0
  pairwise_huber_delta: 0.05
  pairwise_pairs_per_batch: 1024
  objective_warmup_epochs: 0
  warmup_beta_mse_weight: 1.0
  warmup_beta_huber_weight: 0.0
  warmup_residual_huber_weight: 0.1
  warmup_shrinkage_weight: 0.0001

training:
  seed: 17
  device: auto
  epochs: 20
  min_epochs: 10
  steps_per_epoch: 250
  sample_batch_size: 128
  cpg_batch_size: 256
  learning_rate: 0.0001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
  patience: 8
  min_delta: 0.0001
  checkpoint_metric: mas_pcc
  validation_every: 1
  validation_max_cpgs: 2048
  save_every_epoch: false
  cpg_sampling: uniform

evaluation:
  sample_chunk_size: 128
  cpg_chunk_size: 256
  max_cpgs_per_panel: 4096
  save_predictions: true
