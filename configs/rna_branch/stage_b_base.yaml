run_name: rna_branch_stage_b
output_dir: artifacts/rna_branch/stage_b/screening/default

data:
  # Reuses the exact frozen Stage A canonical inputs (same CpG/patient splits,
  # same NTv3 prior/variability/embeddings, same seed 20260728/20260729).
  # See artifacts/rna_branch/2026-07-29_first_benchmark/inputs/manifest.json.
  # Do not regenerate or modify these files from Stage B.
  rna:
    path: artifacts/rna_branch/2026-07-29_first_benchmark/inputs/tcga_rna.h5
    values_key: X
    row_ids_key: sample_idx
    col_ids_key: gene_ids
  methylation:
    path: artifacts/rna_branch/2026-07-29_first_benchmark/inputs/tcga_chr1_beta.h5
    values_key: beta
    row_ids_key: sample_idx
    col_ids_key: cpg_idx
  locus_embeddings:
    path: artifacts/rna_branch/2026-07-29_first_benchmark/inputs/locus_embeddings.h5
    values_key: embeddings
    row_ids_key: cpg_idx
    col_ids_key: null
  locus_features:
    path: artifacts/rna_branch/2026-07-29_first_benchmark/inputs/locus_features.parquet
    id_column: cpg_idx
  sample_metadata:
    path: artifacts/rna_branch/2026-07-29_first_benchmark/inputs/sample_metadata.parquet
    id_column: sample_idx
  cpg_splits:
    path: artifacts/rna_branch/2026-07-29_first_benchmark/inputs/cpg_split_manifest.parquet
    id_column: cpg_idx
  sample_id_column: sample_idx
  cpg_id_column: cpg_idx
  cancer_type_column: cancer_type
  split_column: split
  prior_column: pred_ntv3_prior
  embedding_key: embeddings
  locus_ids_key: cpg_idx
  variability_between_column: pred_log_var_between
  variability_within_column: pred_log_var_within
  rna_control: real
  standardize_rna: true
  clip_beta_epsilon: 0.0001
  allow_partial_overlap: false

# Stage A winner: linear RNA encoder, bilinear interaction, variability gate.
# Stage B holds interaction/gate/loss/sampling/panels fixed and varies only
# the RNA encoder (this block) and, in the weight-decay grid, training.weight_decay.
model:
  encoder:
    kind: linear
    latent_dim: 64
    hidden_dims: [1024, 256]
    dropout: 0.10
    layer_norm: true
    value_encoding: linear
    fourier_frequencies: 8
    token_dim: 128
    num_latents: 32
    num_heads: 8
    num_self_attention_blocks: 2
  interaction:
    kind: bilinear
    hidden_dim: 128
    dropout: 0.10
    num_heads: 8
  gate:
    kind: variability
    hidden_dim: 64
    dropout: 0.0
    initial_global_scale: 1.0
  anchor_to_mean_rna: true
  zero_init_residual: true

loss:
  beta_mse_weight: 1.0
  residual_huber_weight: 0.1
  residual_huber_delta: 1.0
  shrinkage_weight: 0.0001

training:
  seed: 17
  device: auto
  epochs: 100
  steps_per_epoch: 250
  sample_batch_size: 32
  cpg_batch_size: 256
  learning_rate: 0.0002
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  amp: true
  patience: 15
  min_delta: 0.00001
  train_sample_split: train
  train_cpg_split: train
  validation_sample_split: validation
  validation_cpg_split: validation
  checkpoint_metric: mse
  validation_every: 1
  validation_max_cpgs: 512

evaluation:
  sample_chunk_size: 128
  cpg_chunk_size: 256
  max_cpgs_per_panel: 1024
  save_predictions: false
  prediction_format: npz
  panels:
    in_distribution:
      sample_split: train
      cpg_split: train
    sample_ood:
      sample_split: test
      cpg_split: train
    locus_ood:
      sample_split: train
      cpg_split: test
    double_ood:
      sample_split: test
      cpg_split: test
