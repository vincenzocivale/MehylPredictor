# Stage G1: which component of Stage F's F2 win (concat + explicit product,
# MLP decoder) actually does the work? Encoder A0 (linear, 64-dim), frozen
# NTv3 prior, and the Stage E2.5/F training protocol are unchanged; only the
# joint feature map and decoder depth vary. RNA and locus are each
# independently projected to a 64-dim factor (p, q) before combination, so
# every cell here uses the *same* g~=P_g(loci) convention as the ablation
# matrix -- this is deliberately not bit-identical to Stage F's production
# `concat` kind, which concatenates the raw 1536-dim locus embedding instead
# of a projected g~ (see docs/rna_fusion_stage_f.md).
#
# G0 (bilinear control) is NOT listed as a run here -- it reuses the existing
# Stage F confirm-grid runs (f0_bilinear_c0_seed{17,23,41}) unchanged.
#
#   Code | joint feature to decoder | decoder      | interaction.kind
#   G1   | [p; q]                   | MLP          | concat_only
#   G2   | p*q                      | MLP          | product_only
#   G3   | [p; q; p*q]              | linear       | concat_product_linear
#   G4   | [p; q; p*q]              | MLP          | interaction_mlp
base_config: stage_f_base.yaml
runs:
- name: g1_concat_only_seed17
  override:
    model:
      encoder:
        kind: linear
      interaction:
        kind: concat_only
        mlp_hidden_dims: [128, 32]
    training:
      seed: 17
      save_every_epoch: true
    evaluation:
      save_predictions: true
    output_dir: artifacts/rna_branch/stage_g1_fusion_ablation/default
- name: g2_product_only_seed17
  override:
    model:
      encoder:
        kind: linear
      interaction:
        kind: product_only
        mlp_hidden_dims: [128, 32]
    training:
      seed: 17
      save_every_epoch: true
    evaluation:
      save_predictions: true
    output_dir: artifacts/rna_branch/stage_g1_fusion_ablation/default
- name: g3_concat_product_linear_seed17
  override:
    model:
      encoder:
        kind: linear
      interaction:
        kind: concat_product_linear
    training:
      seed: 17
      save_every_epoch: true
    evaluation:
      save_predictions: true
    output_dir: artifacts/rna_branch/stage_g1_fusion_ablation/default
- name: g4_interaction_mlp_seed17
  override:
    model:
      encoder:
        kind: linear
      interaction:
        kind: interaction_mlp
        mlp_hidden_dims: [128, 32]
    training:
      seed: 17
      save_every_epoch: true
    evaluation:
      save_predictions: true
    output_dir: artifacts/rna_branch/stage_g1_fusion_ablation/default
