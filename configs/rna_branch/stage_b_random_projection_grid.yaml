# Stage B / family 3 (control): frozen Gaussian random projection at the same
# dimensionalities as the PCA grid, same downstream learned linear projection.
# Isolates whether PCA's learned structure matters vs arbitrary same-rank compression.
# Features under artifacts/rna_branch/stage_b/features/randomproj_<dim>.{h5,json}.
base_config: stage_b_base.yaml
runs:
  - name: randomproj032_linear_seed17
    override:
      data: {rna: {path: artifacts/rna_branch/stage_b/features/randomproj_032.h5, values_key: X, row_ids_key: sample_idx, col_ids_key: component_ids}, standardize_rna: false}
      model: {encoder: {kind: linear, latent_dim: 32}}
      training: {seed: 17}
