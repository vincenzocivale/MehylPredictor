# Multi-seed confirmation for the two candidates the single-seed b0-b4 ablation
# narrowed to before opening the held-out test: b0 (MSE control) and b3
# (locus_skill + within_cancer_dynamic, the single-seed winner on
# mas_skill_vs_prior_variable). Two additional seeds each, same overrides as
# stage_chr1_biological_fidelity_grid.yaml's b0/b3 entries -- not the full grid.
base_config: stage_chr1_biological_fidelity_base.yaml
runs:
- name: b0_fullcoverage_mse_control_s23
  override:
    loss:
      beta_mse_weight: 1.0
      residual_huber_weight: 0.1
      global_prior_ratio_weight: 0.0
      locus_skill_weight: 0.0
      locus_ccc_weight: 0.0
      within_cancer_dynamic_weight: 0.0
      locus_pearson_weight: 0.0
      objective_warmup_epochs: 0
      objective_ramp_epochs: 0
    training:
      seed: 23
      checkpoint_metric: mse
      checkpoint_min_global_skill: null
      checkpoint_min_amplitude_ratio: null
      checkpoint_max_amplitude_ratio: null
    output_dir: artifacts/rna_branch/chr1_biological_fidelity_multiseed/b0_mse_control_s23

- name: b0_fullcoverage_mse_control_s41
  override:
    loss:
      beta_mse_weight: 1.0
      residual_huber_weight: 0.1
      global_prior_ratio_weight: 0.0
      locus_skill_weight: 0.0
      locus_ccc_weight: 0.0
      within_cancer_dynamic_weight: 0.0
      locus_pearson_weight: 0.0
      objective_warmup_epochs: 0
      objective_ramp_epochs: 0
    training:
      seed: 41
      checkpoint_metric: mse
      checkpoint_min_global_skill: null
      checkpoint_min_amplitude_ratio: null
      checkpoint_max_amplitude_ratio: null
    output_dir: artifacts/rna_branch/chr1_biological_fidelity_multiseed/b0_mse_control_s41

- name: b3_locus_skill_plus_within_cancer_s23
  override:
    training:
      seed: 23
    loss:
      locus_skill_weight: 1.0
      locus_ccc_weight: 0.0
      within_cancer_dynamic_weight: 0.5
      locus_pearson_weight: 0.0
    output_dir: artifacts/rna_branch/chr1_biological_fidelity_multiseed/b3_skill_within_s23

- name: b3_locus_skill_plus_within_cancer_s41
  override:
    training:
      seed: 41
    loss:
      locus_skill_weight: 1.0
      locus_ccc_weight: 0.0
      within_cancer_dynamic_weight: 0.5
      locus_pearson_weight: 0.0
    output_dir: artifacts/rna_branch/chr1_biological_fidelity_multiseed/b3_skill_within_s41
