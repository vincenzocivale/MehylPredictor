# Stage B / family 2: train-only IncrementalPCA (fit on training patients only,
# see rna_branch fit-pca) followed by a learned linear projection (encoder.kind=linear).
# PCA basis + manifest saved under artifacts/rna_branch/stage_b/features/pca_<dim>.{h5,json}.
base_config: stage_b_base.yaml
runs:
  - name: pca032_linear_seed17
    override:
      data:
        rna: {path: artifacts/rna_branch/stage_b/features/pca_032.h5, values_key: X, row_ids_key: sample_idx, col_ids_key: component_ids}
        standardize_rna: false
      model: {encoder: {kind: linear, latent_dim: 32}}
      training: {seed: 17}
  - name: pca032_linear_seed29
    override:
      data: {rna: {path: artifacts/rna_branch/stage_b/features/pca_032.h5, values_key: X, row_ids_key: sample_idx, col_ids_key: component_ids}, standardize_rna: false}
      model: {encoder: {kind: linear, latent_dim: 32}}
      training: {seed: 29}
  - name: pca032_linear_seed43
    override:
      data: {rna: {path: artifacts/rna_branch/stage_b/features/pca_032.h5, values_key: X, row_ids_key: sample_idx, col_ids_key: component_ids}, standardize_rna: false}
      model: {encoder: {kind: linear, latent_dim: 32}}
      training: {seed: 43}

  - name: pca064_linear_seed17
