base_config: base.yaml
runs:
  - name: mean_rna_negative_control
    override:
      data:
        rna_control: mean
      model:
        encoder:
          kind: linear
        gate:
          kind: global
  - name: cancer_type_only
    override:
      data:
        rna_control: cancer_type_only
        standardize_rna: false
      model:
        encoder:
          kind: linear
        gate:
          kind: variability
  - name: rna_linear_real
    override:
      data:
        rna_control: real
      model:
        encoder:
          kind: linear
        interaction:
          kind: bilinear
        gate:
          kind: variability
  - name: rna_linear_shuffle_global
    override:
      data:
        rna_control: shuffle_global
      model:
        encoder:
          kind: linear
  - name: rna_linear_shuffle_within_cancer
    override:
      data:
        rna_control: shuffle_within_cancer
      model:
        encoder:
          kind: linear
  - name: rna_mlp_real
    override:
      data:
        rna_control: real
      model:
        encoder:
          kind: mlp
