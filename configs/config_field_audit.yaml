schema_version: 2
scope: final RNA architecture/loss configuration
status: phase6d2_pruned

encoder_config:
  keep:
    - kind
    - latent_dim
    - layer_norm
    - hidden_dim
    - dropout
    - n_programs
    - program_dim
    - n_heads
    - n_blocks
    - mlp_ratio
    - frozen_embedding_source
    - pathway_membership_path
    - pathway_dim1
    - pathway_dim2

model_config:
  keep: [encoder, functional_fusion_variant]
  removed:
    - interaction
    - trunk
    - axial
    - beta_likelihood_head
    - zero_init_residual
    - variance_normalized_residual
    - use_prior_anchor

loss_config:
  keep:
    - beta_mse_weight
    - locus_pearson_weight
    - locus_min_observed_samples
    - locus_pearson_epsilon
    - locus_pearson_min_target_std
    - sample_pearson_weight
    - sample_pearson_min_observed_cpgs
    - sample_pearson_epsilon
    - locus_centered_mse_weight
  removed:
    - residual_huber_weight
    - residual_huber_delta
    - shrinkage_weight
    - standardized_residual_huber_weight
    - standardized_residual_huber_delta
    - standardized_shrinkage_weight
    - sigma_min
    - beta_nll_weight
    - beta_nll_epsilon
    - concentration_min

locus_cls:
  keep: [use_mean_branch, aux_weight, final_regressor_dropout]
  removed:
    - use_fusion_product
    - use_raw_product
    - product_mlp
    - include_raw_rna
    - include_raw_cpg
    - fusion_init_std
    - query_source
    - residual_aux_weight
    - raw_lr_multiplier
    - trunk_hidden_dim
    - bottleneck_dim
    - trunk_dropout

runtime_compatibility:
  removed:
    - src/methylation_predictor/rna_training/locus_cls_trainer.py
    - LocusCLSJointTrainer
    - evaluate_official_split
    - _retired_locus_compat
  deferred:
    - locus_cls_joint run-storage key
  next_phase: 6e optional storage-key migration
