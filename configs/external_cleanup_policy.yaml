schema_version: 1
policy:
  destructive_actions_allowed: false
  require_architecture_selected_for_run_cleanup: true
  require_fresh_paper_runs_verified_for_run_cleanup: true
  final_keep_source: standardized paper/record.json files
  default_unmatched_classification: REVIEW
always_keep:
- path: datasets/methylprophet_repro_v1
  reason: immutable canonical TCGA bundle and frozen protocol definitions
- path: reference/hg38
  reason: hg38 reference asset required to reproduce benchmark/data preparation
paper_runtime_keep:
- path: derived/methylprophet_table5_tcga_chr1/rna
  reason: canonical normalized RNA cache for matched chr1
- path: derived/cpg_statistics/chr1
  reason: split-safe CpG mean targets
- path: derived/ntv3_functional_peak_atlas_chr1_all_sources
  reason: functional regulatory atlas
- path: derived/ntv3_probe_targets/chr1_annotation_features_all_sources
  reason: static and regulatory-breadth annotation cache
- path: derived/methylprophet_table5_tcga_chr1/features
  reason: transitional metric-only prior cache
- path: derived/methylprophet_table5_tcga_chr1
  reason: matched Table-5 protocol preparation
- path: derived/bulkformer_embeddings/tcga_147m
  reason: frozen BulkFormer RNA comparator cache
- path: derived/bulkrnabert_embeddings/tcga
  reason: frozen BulkRNABert RNA comparator cache
- path: derived/ntv3_pre_chr1_atlas
  reason: >-
    E04 genomic-FM baseline embedding (InstaDeepAI/NTv3_650M_pre, chr1-only,
    2,004,436 loci = full chr1 CpG universe, 1536-d, window 32768bp).
    Relocated 2026-09-13 from derived/tcga_canonical/chr1_ntv3_pretrain_atlas_v1.h5
    (a misleadingly generic directory name that caused it to be missed by
    both the automated inventory and an earlier manual review pass) into
    this clearly named path. Confirmed distinct from and NOT a substitute
    for derived/locus_features_v1 -- see docs/PAPER_EXPERIMENTS.md's
    external storage reorganization note.
candidate_name_patterns:
  scratch:
  - .eval_runs
  - smoke
  - scratch
  - tmp
  historical_experiment:
  - shared-backbone
  - query
  - router
  - program-projection
  - program_projection
  - ntv3-pre
  - ntv3-post
  - pretrain_ablation
  historical_cache:
  - ntv3_pre
  - ntv3_post
  - pretrain_ablation
  - gena_chr1
  # Historical record only -- these paths were investigated, confirmed
  # unreferenced by any active runtime/paper-experiment code path (verified
  # 2026-09-13 via forensic inspection: HDF5 attribute/checkpoint provenance
  # for the NTv3 items, codebase grep for the rest), and physically deleted
  # under explicit user authorization (backup held on another machine) on
  # 2026-09-13. See `deleted_2026_09_13` below for exact bytes reclaimed.
  # Kept here so a future re-appearance of an identically-named directory is
  # still heuristically flagged, not silently trusted.
  confirmed_unreferenced_deleted_2026_09_13:
  - genomic_prior_v2
  - hyenadna_expansion
  - ntv3_functional_peak_atlas_chr1
  - ntv3_post_track_manifest
  - ntv3_pretrain_expansion
  - methylprophet_table5_tcga_chr1_pretrain_ablation
  - rna_feature_cache_ntv3_pre
  - rna_feature_cache
  - ntv3_650m_post_hf_cache
  - ntv3_expansion
  - tcga_canonical
deleted_2026_09_13:
  authorized_by: user, explicit, backup held on another machine
  total_reclaimed_bytes: 107088410358
  items:
  - {path: derived/genomic_prior_v2, bytes: 1364300147}
  - {path: derived/hyenadna_expansion, bytes: 1042321393}
  - {path: derived/ntv3_functional_peak_atlas_chr1, bytes: 554091849}
  - {path: derived/ntv3_post_track_manifest, bytes: 2639222995}
  - {path: derived/ntv3_pretrain_expansion, bytes: 12404860916}
  - {path: derived/methylprophet_table5_tcga_chr1_pretrain_ablation, bytes: 9054692736}
  - {path: derived/rna_feature_cache_ntv3_pre, bytes: 125457107}
  - {path: derived/rna_feature_cache, bytes: 18169727692}
  - {path: model_weights_cache/ntv3_650m_post_hf_cache, bytes: 8984371747}
  - {path: derived/ntv3_expansion, bytes: 52623198832}
  - {path: derived/tcga_canonical, bytes: 126164944, note: "only after relocating chr1_ntv3_pretrain_atlas_v1.h5 out to derived/ntv3_pre_chr1_atlas/ -- see paper_runtime_keep"}
# Named artifacts explicitly deferred to manual human review -- do NOT add to
# candidate_name_patterns (that would let them auto-classify as
# DELETE_CANDIDATE once the safety gates open).
manual_review_only:
- path: derived/methylprophet_compact_chr123
  reason: >-
    referenced by PROJECT_SPECS.md and docs/MEAN_CONTRIBUTION_EXPERIMENTS.md
    as the live chr123-scope data preparation target (not referenced by the
    chr1-only paper_chr1.yaml profile, which is why the automated inventory
    still flags it REVIEW) -- kept, not a cleanup target.
run_policy:
  before_architecture_selection: PROTECT
  after_architecture_selection_before_fresh_paper_verification: PROTECT
  after_fresh_paper_verification:
    referenced_by_paper_record: KEEP
    unreferenced: REVIEW
scan_roots:
- derived
- experiments/runs
- experiments/searches
- model_weights_cache
- reference
