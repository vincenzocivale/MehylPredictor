run_name: p0_mean_layer2
output_dir: artifacts/rna_encoder_readout/search

token_cache:
  path: artifacts/rna_encoder_readout/cache/bulkrnabert_l1_l2_l3_4096.h5
  layers: [1, 2, 3]
  tokens_key_template: tokens_layer{layer}
  sample_ids_key: sample_idx
  gene_ids_key: gene_ids
  expression_key: expression_log2p1
  normalized_expression_key: normalized_expression
  token_ids_key: token_ids
  split_key: split
  cancer_key: cancer_type
  augmentation_path: null

rna:
  path: artifacts/rna_branch/pretrained/inputs/tcga_rna_full_gene.h5
  values_key: X
  row_ids_key: sample_idx
  col_ids_key: gene_ids

model:
  kind: mean
  primary_layer: 2
  output_dim: 256
  hidden_dim: 256
  num_heads: 4
  num_queries: 4
  dropout: 0.1
  weight_mode: within_variance
  continuous_mode: none
  fourier_frequencies: 8
  module_membership_path: null
  perceiver_self_attention_layers: 1

objective:
  target_gene_count: 4096
  target_selection: stratified_variance
  selection_seed: 17
  total_weight: 1.0
  within_weight: 1.0
  consistency_weight: 0.0
  input_target_overlap_allowed: false

training:
  seed: 17
  batch_size: 128
  num_workers: 4
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.001
  gradient_clip_norm: 1.0
  patience: 8
  min_delta: 0.00001
  device: auto
  mixed_precision: true
  warm_start_checkpoint: null
  warm_start_mode: decoder_only
  seed_initial_checkpoint: true
