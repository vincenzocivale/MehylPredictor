# Development-stage config for the canonical genome-wide, full-coverage
# training protocol. Two stages, run in sequence by scripts/train.sh:
#   1. development training (this config) -- data.sample_metadata/cpg_splits
#      point at a nested split strictly inside the official `train` label
#      (scripts/build_dev_split.py): 90% stays `train` (the fit pool), 10%
#      is relabeled `dev_heldout` (this stage's early-stopping validation),
#      seed 17, stratified by chromosome/cancer_type. Official validation/
#      test are NEVER referenced by this config.
#   2. final refit -- scripts/render_final_refit_config.py derives a final
#      config from this one plus the development stage's measured
#      best_epoch: same architecture/hyperparameters/optimizer/schedule/seed,
#      but data.sample_metadata/cpg_splits point back at the ORIGINAL,
#      unmodified manifests (100% of official train_cpg/train_sample), and
#      training runs for exactly best_epoch epochs with early stopping
#      structurally disabled.
#
# training.cpg_sampling: full_coverage is the deterministic full-CpG-coverage
# sampler (required for genome-wide full-coverage training; replaces
# per-step random draws). tracking is enabled (W&B scalars only;
# log_checkpoint left false -- see the comment near the bottom of this file).
# evaluation.panels is emptied: real evaluation is a separate, streaming
# step outside this in-training panel loop.
run_name: train-dev-seed17
output_dir: artifacts/train/seed17/development

data:
  rna:
    path: /data/dataset/methylation/genomic_encoder_genome_wide_scratch/rna_branch_inputs/tcga_rna.h5
    values_key: X
    row_ids_key: sample_idx
    col_ids_key: gene_ids
  methylation:
    path: /data/dataset/methylation/genomic_encoder_genome_wide_scratch/rna_branch_inputs/tcga_genome_wide_beta.h5
    values_key: beta
    row_ids_key: sample_idx
    col_ids_key: cpg_idx
  locus_embeddings:
    path: /data/dataset/methylation/genomic_encoder_genome_wide_scratch/rna_branch_inputs/locus_embeddings.h5
    values_key: embeddings
    row_ids_key: cpg_idx
  locus_features:
    path: /data/dataset/methylation/genomic_encoder_genome_wide_scratch/rna_branch_inputs/locus_features.parquet
    id_column: cpg_idx
  sample_metadata:
    path: /data/dataset/methylation/genomic_encoder_genome_wide_scratch/rna_branch_inputs_dev_seed17/sample_metadata_dev.parquet
    id_column: sample_idx
  cpg_splits:
    path: /data/dataset/methylation/genomic_encoder_genome_wide_scratch/rna_branch_inputs_dev_seed17/cpg_split_manifest_dev.parquet
    id_column: cpg_idx
  rna_control: real
  standardize_rna: true
  clip_beta_epsilon: 1.0e-4

model:
  encoder:
    kind: linear
    latent_dim: 64
    layer_norm: true
  interaction:
    kind: concat
    hidden_dim: 128
    dropout: 0.1
  gate:
    kind: variability
    hidden_dim: 64
    dropout: 0.0
  anchor_to_mean_rna: true
  zero_init_residual: true

loss:
  beta_mse_weight: 1.0
  residual_huber_weight: 0.1
  residual_huber_delta: 1.0
  shrinkage_weight: 1.0e-4

training:
  seed: 17
  device: auto
  epochs: 50
  min_epochs: 10
  # steps_per_epoch is NOT used in full_coverage mode (the sampler derives
  # the real per-epoch step count from cpg_batch_size/sample_batch_size and
  # the actual pool sizes -- see full_coverage_sampler.py); left at its
  # frozen value here purely for diff-clarity against prior configs.
  steps_per_epoch: 64
  sample_batch_size: 64
  cpg_batch_size: 2048
  cpg_sampling: full_coverage
  learning_rate: 2.0e-5
  weight_decay: 1.0e-4
  gradient_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
  allow_tf32: true
  matmul_precision: high
  fused_adamw: true
  patience: 10
  min_delta: 1.0e-5
  checkpoint_metric: mse
  checkpoint_selection: best
  validation_every: 1
  validation_sample_split: dev_heldout
  validation_cpg_split: dev_heldout
  train_sample_split: train
  train_cpg_split: train
  validation_max_cpgs: 1024
  save_every_epoch: false

evaluation:
  sample_chunk_size: 128
  cpg_chunk_size: 512
  max_cpgs_per_panel: null
  save_predictions: false
  panels: {}

tracking:
  backend: wandb
  project: MethylationPredictor
  group: methylation-predictor-genomewide-fullcoverage
  name: train-dev-seed17
  job_type: train
  tags: ["genome-wide", "full-coverage", "seed17", "development"]
  log_every_steps: 25
  watch_model: false
  # Kept false during training -- an earlier run with log_checkpoint=true
  # was SIGTERM'd twice at the same deterministic epoch, suspected cause a
  # network stall in the inline W&B artifact upload. The checkpoint+manifest
  # are uploaded as a W&B artifact in a separate post-hoc step instead
  # (see `cli.py upload-artifact`).
  log_checkpoint: false
