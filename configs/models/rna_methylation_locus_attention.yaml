# New primary/reference RNA-methylation recipe (2026-09-05), superseding
# rna_methylation_shared_backbone.yaml (encoder.kind=linear) and
# rna_methylation_shared_backbone_mhc*.yaml (mHC trunk) -- see
# docs/RNA_METHYLATION.md's "2026-09-05 update" section for the empirical
# ablation ladder (A/B + product/mean isolation, chr1, seed 17) that
# justifies this change.
#
# What changed vs the FeatureFusionLocusCLSModel-era reference:
#   - model.encoder.kind: linear -> locus_attention. The RNA representation is
#     locus-conditioned (cross-attention over 64 gene-program tokens, query =
#     the CpG's own NTv3 embedding) instead of one vector shared by every CpG
#     of a sample. This alone explains 74-91% of the mHC model's total gain
#     over the old linear-encoder reference, across all three official chr1
#     views -- see the ablation ladder.
#   - locus_cls.use_raw_product: false. The elementwise RNA*CpG product term
#     was measured to help only on the train_cpg_x_val_sample view (already-
#     seen loci, +8.6% MSE) and to do essentially nothing on either unseen-CpG
#     view -- the two views that matter for genuine generalization. Dropped for
#     simplicity rather than kept for a gain concentrated on the
#     least-generalization-relevant view. Caveat: the isolated cell "product
#     removed, mean kept" was never itself trained (only "both kept", "both
#     removed", and "mean removed, product kept" have official numbers) --
#     train/evaluate this exact recipe before citing its numbers anywhere.
#   - model.trunk: still absent (kind="none"). The ablation ladder found the
#     mHC trunk (stream semantics + Sinkhorn-constrained exchange + additive
#     residual readout) responsible for only a small fraction of the total
#     gain (~0.005-0.009 MAS-PCC out of ~0.02-0.07, single seed) -- see
#     docs/RNA_METHYLATION.md. It is demoted to an ablation arm, not part of
#     the reference architecture, pending stronger (multi-seed, deeper-trunk,
#     capacity-matched-control) evidence -- the depth/capacity control run
#     (row C) was interrupted before producing an official number.
#
# Everything else (mean branch, concat fusion, direct sigmoid readout, loss,
# training schedule) is unchanged from the FeatureFusionLocusCLSModel-era
# reference -- this is deliberately a single, isolated encoder+interaction
# change, not a new macro-architecture, so future RNA-encoder comparisons
# (the repo's stated forward direction, see docs/RNA_METHYLATION.md) share
# this same fixed harness.
model:
  encoder:
    kind: locus_attention
    latent_dim: 256
    n_programs: 64
    program_dim: 256
    n_heads: 4
    dropout: 0.1
    layer_norm: true
  interaction:
    kind: concat
    hidden_dim: 128
    dropout: 0.1
  zero_init_residual: true
  variance_normalized_residual: true
loss:
  beta_mse_weight: 1.0
  residual_huber_weight: 0.0
  shrinkage_weight: 0.0
  standardized_residual_huber_weight: 0.1
  standardized_residual_huber_delta: 1.0
  standardized_shrinkage_weight: 1.0e-4
  sigma_min: 0.05
  locus_pearson_weight: 0.15
  locus_min_observed_samples: 8

training:
  seed: 17
  device: auto
  epochs: 80
  steps_per_epoch: 250
  sample_batch_size: 32
  cpg_batch_size: 256
  learning_rate: 2.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine_warmup
  scheduler_horizon_epochs: 80
  warmup_epochs: 1.0
  min_lr_ratio: 0.1
  gradient_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
  allow_tf32: true
  matmul_precision: high
  fused_adamw: true
  patience: 15
  min_delta: 1.0e-05
  num_workers: 0
  schedule_layout: contiguous_blocks
  prefetch_depth: 8
  prefetch_workers: 4
  hdf5_cache_mb: 256
  checkpoint_every: 1
  compile: false
  validation_sample_split: validation
  validation_cpg_split: validation
  train_sample_split: train
  train_cpg_split: train
  checkpoint_metric: mse
  validation_every: 1
  validation_max_cpgs: 512
  min_epochs: 0
  save_every_epoch: false
  cpg_sampling: uniform
  checkpoint_selection: best

schedule_policy: pair_complete
exclude_official_val_from_auxiliary: true
structured_loss_sources: [array, epic, wgbs]

locus_cls:
  use_mean_branch: true
  use_fusion_product: false
  use_raw_product: false
  fusion_init_std: 0.01
  aux_weight: 0.15
  residual_aux_weight: 0.0
  raw_lr_multiplier: 1.0
  trunk_hidden_dim: 256
  bottleneck_dim: 64

batching:
  array: {sample_size: 640, cpg_size: 640}
  epic: {sample_size: 160, cpg_size: 5120}
  wgbs: {sample_size: 32, cpg_size: 20480}

development:
  fraction: 0.10
  block_bp: 5000000

tracking:
  backend: wandb
  project: MethylPredictor
  mode: online
  group: rna_methylation_locus_attention_reference
  job_type: train
  tags: [reference, locus-attention, no-product]
