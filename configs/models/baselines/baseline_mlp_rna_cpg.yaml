# Baseline (paper comparison, see docs/PAPER_EXPERIMENTS.md): "MLP RNA-CpG".
# Combines RNA and CpG representations through a generic multilayer perceptron
# -- use_raw_product: false drops the explicit proj(rna) * proj(cpg) term, so
# the raw branch's joint input is only [rna, cpg]. use_mean_branch: false
# removes the locus-only mean branch, so the model really is a plain nonlinear
# fusion of RNA and CpG with no explicit interaction term. Tests whether a
# standard nonlinear fusion model can capture the patient-specific methylation
# deviations without the reference architecture's explicit interaction term.
#
# Reproduced under the reference shared-backbone engine
# (FeatureFusionArchitectureVariantModel) -- see models.py's docstring-in-code
# for the include_raw_rna/include_raw_cpg/use_raw_product axis. The retired
# two-stage engine's InteractionConfig.kind=concat/include_product=false
# baseline (frozen chr1 numbers under
# results/reference/methylprophet_comparison/baselines_chr1.md) is no longer
# reproducible -- see CLAUDE.md's "Model compatibility note". Otherwise
# identical to configs/models/rna_methylation_shared_backbone.yaml.
model:
  encoder:
    kind: linear
    latent_dim: 256
    layer_norm: true
  interaction:
    kind: concat
    hidden_dim: 128
    dropout: 0.1

loss:
  beta_mse_weight: 1.0
  residual_huber_weight: 0.0
  shrinkage_weight: 0.0
  standardized_residual_huber_weight: 0.1
  standardized_residual_huber_delta: 1.0
  standardized_shrinkage_weight: 1.0e-4
  sigma_min: 0.05
  locus_pearson_weight: 0.15
  locus_min_observed_samples: 8

training:
  seed: 17
  epochs: 80
  learning_rate: 5.0e-5
  weight_decay: 1.0e-4
  scheduler: constant
  scheduler_horizon_epochs: 80
  warmup_epochs: 0.0
  min_lr_ratio: 0.1
  gradient_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
  allow_tf32: true
  matmul_precision: high
  fused_adamw: true
  schedule_layout: contiguous_blocks
  prefetch_depth: 2
  hdf5_cache_mb: 256
  checkpoint_every: 1
  compile: false

schedule_policy: pair_complete
exclude_official_val_from_auxiliary: true
structured_loss_sources: [array, epic, wgbs]

locus_cls:
  use_mean_branch: false
  use_fusion_product: false
  use_raw_product: false
  include_raw_rna: true
  include_raw_cpg: true
  fusion_init_std: 0.01
  aux_weight: 0.15
  residual_aux_weight: 0.0
  raw_lr_multiplier: 1.0
  trunk_hidden_dim: 256
  bottleneck_dim: 64
  trunk_dropout: 0.1

batching:
  array: {sample_size: 640, cpg_size: 640}
  epic: {sample_size: 160, cpg_size: 5120}
  wgbs: {sample_size: 32, cpg_size: 20480}

development:
  fraction: 0.10
  block_bp: 5000000

tracking:
  backend: wandb
  project: MethylPredictor
  group: null
  name: null
  job_type: train
  tags: [baseline, mlp-rna-cpg]
  mode: online
  log_every_steps: 25
  watch_model: false
  log_checkpoint: false
