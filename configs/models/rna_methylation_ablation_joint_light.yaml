# Ablation-only, reduced-cost copy of rna_methylation.yaml for the joint-training
# ablation (see scripts/experiments/train_joint_ablation.py) -- smaller EPIC/WGBS
# batches to cut per-step network I/O and GPU memory on a shared machine; epoch
# count is overridden separately via --epochs. Delete alongside the rest of the
# joint-training ablation once it concludes.
model:
  encoder:
    kind: linear
    latent_dim: 256
    layer_norm: true
  interaction:
    kind: concat
    hidden_dim: 128
    dropout: 0.1
  zero_init_residual: true
  variance_normalized_residual: true

loss:
  beta_mse_weight: 1.0
  residual_huber_weight: 0.0
  shrinkage_weight: 0.0
  standardized_residual_huber_weight: 0.1
  standardized_residual_huber_delta: 1.0
  standardized_shrinkage_weight: 1.0e-4
  sigma_min: 0.05
  locus_pearson_weight: 0.15
  locus_min_observed_samples: 8

training:
  seed: 17
  epochs: 20
  learning_rate: 5.0e-5
  weight_decay: 1.0e-4
  scheduler: constant
  scheduler_horizon_epochs: 20
  warmup_epochs: 0.0
  min_lr_ratio: 0.1
  gradient_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
  allow_tf32: true
  matmul_precision: high
  fused_adamw: true

schedule_policy: axis_full_coverage
exclude_official_val_from_auxiliary: true
structured_loss_sources: [array, epic, wgbs]

batching:
  array: {sample_size: 512, cpg_size: 512}
  epic: {sample_size: 64, cpg_size: 1024}
  wgbs: {sample_size: 16, cpg_size: 4096}

development:
  fraction: 0.10
  block_bp: 5000000

tracking:
  backend: none
