# Canonical RNA-conditioned methylation predictor (former V1).
model:
  encoder:
    kind: linear
    latent_dim: 256
    layer_norm: true
  interaction:
    kind: concat
    hidden_dim: 128
    dropout: 0.1
  zero_init_residual: true
  variance_normalized_residual: true

loss:
  beta_mse_weight: 1.0
  residual_huber_weight: 0.0
  shrinkage_weight: 0.0
  standardized_residual_huber_weight: 0.1
  standardized_residual_huber_delta: 1.0
  standardized_shrinkage_weight: 1.0e-4
  sigma_min: 0.05
  locus_pearson_weight: 0.15
  locus_min_observed_samples: 8

training:
  seed: 17
  epochs: 80
  learning_rate: 5.0e-5
  weight_decay: 1.0e-4
  scheduler: constant
  scheduler_horizon_epochs: 80
  warmup_epochs: 0.0
  min_lr_ratio: 0.1
  gradient_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
  allow_tf32: true
  matmul_precision: high
  fused_adamw: true

# Scalable default. Use --engine matched_chr1 for the exact pair-complete chr1
# E1 reproduction. For a pair-complete chr123 study, set this explicitly to
# pair_complete in a copied recipe and record the compute budget.
schedule_policy: axis_full_coverage
exclude_official_val_from_auxiliary: true
structured_loss_sources: [array, epic, wgbs]

batching:
  array: {sample_size: 512, cpg_size: 512}
  epic: {sample_size: 128, cpg_size: 4096}
  wgbs: {sample_size: 32, cpg_size: 16384}

development:
  fraction: 0.10
  block_bp: 5000000

tracking:
  backend: wandb
  project: MethylPredictor
  group: null
  name: null
  job_type: train
  tags: [canonical, variance-normalized]
  mode: online
  log_every_steps: 25
  watch_model: false
  log_checkpoint: false
