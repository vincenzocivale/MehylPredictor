# chr123 I/O-tuned variant of the canonical paper-facing recipe
# (configs/models/main.yaml), v2. Builds on
# configs/models/chr123/main_chr123_iotuned.yaml (hdf5_cache_mb=2048).
# Model/loss/training hyperparameters are otherwise byte-identical to
# main.yaml; only two I/O knobs change relative to it.
#
# Fix 1 (v1, kept): hdf5_cache_mb 256 -> 2048. See main_chr123_iotuned.yaml
# for the chunk-cache-thrashing rationale.
#
# Fix 2 (v2, new 2026-09-13): array.batching.cpg_size 640 -> 2048.
# array.h5's beta dataset is chunked (128, 2048) on (sample, cpg). A
# cpg_size of 640 selects a sub-range of a single 2048-wide chunk column,
# but HDF5 still has to materialize the *entire* chunk to serve that
# partial selection -- so every array step was reading/holding ~3.2x more
# bytes than it used (~31% chunk utilization). array is also the pool with
# by far the most pair_complete steps per epoch (most row-blocks x
# cpg-blocks of the three sources), so this waste was multiplied by the
# largest step count of any pool. Setting cpg_size to exactly one chunk
# width (2048) makes every array read a full, useful chunk with zero
# waste. epic (chunk width 2048, cpg_size 5120) and wgbs (chunk width
# 8192, cpg_size 20480) were already close to full chunk utilization
# (~83%) and are left unchanged.
#
# Do not edit main.yaml in place -- it is the recipe used by the active
# chr1 "main" paper study.
model:
  encoder:
    kind: locus_attention
    latent_dim: 256
    n_programs: 64
    program_dim: 256
    n_heads: 4
    dropout: 0.1
    layer_norm: true
  functional_fusion_variant: efficient_single_attn_8ffn_residual_functional8_head2

loss:
  beta_mse_weight: 1.0
  locus_pearson_weight: 0.15
  locus_min_observed_samples: 8

training:
  seed: 17
  device: auto
  epochs: 80
  learning_rate: 0.0002
  weight_decay: 0.0001
  scheduler: cosine_warmup
  scheduler_horizon_epochs: 80
  warmup_epochs: 1.0
  min_lr_ratio: 0.1
  gradient_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
  allow_tf32: true
  matmul_precision: high
  fused_adamw: true
  schedule_layout: contiguous_blocks
  prefetch_depth: 8
  prefetch_workers: 4
  hdf5_cache_mb: 2048
  checkpoint_every: 1
  validation_every: 1
  compile: false

schedule_policy: pair_complete
exclude_official_val_from_auxiliary: true
structured_loss_sources:
  - array
  - epic
  - wgbs

locus_cls:
  use_mean_branch: true
  aux_weight: 0.15
  final_regressor_dropout: 0.15

batching:
  array:
    sample_size: 320
    cpg_size: 2048
  epic:
    sample_size: 160
    cpg_size: 5120
  wgbs:
    sample_size: 32
    cpg_size: 20480

development:
  fraction: 0.1
  block_bp: 5000000
  split_seed: 17

tracking:
  backend: wandb
  project: MethylPredictor-refactored
  mode: online
  group: functional_concat_final
  job_type: train
  tags:
    - functional-only
    - efficient-single-attn
    - retrieval-8ffn
    - functional-8ffn
    - head-2ffn
    - final-architecture
    - chr123
    - iotuned
    - chunk-aligned
