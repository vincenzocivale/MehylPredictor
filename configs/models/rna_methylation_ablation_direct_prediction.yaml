# Ablation (Experiment B, 2026-08): prior/mu anchor vs. direct raw prediction.
# use_prior_anchor=false selects DirectPredictionModel: prediction_logit =
# raw_delta directly, no CpG-statistics prior added, no sigma scaling.
# zero_init_residual must be false (no anchor to start "at zero" relative to).
# Residual-relative loss terms (huber/shrinkage, standardized or not) are
# zeroed -- there is no meaningful "delta from prior" for this arm; only
# beta_mse and locus_pearson apply. matched_chr1 engine only.
# Not used by any canonical training path -- see results/reference/ablations.yaml
# ::prior_anchor_2026_08 and docs/RNA_METHYLATION.md.
model:
  encoder:
    kind: linear
    latent_dim: 256
    layer_norm: true
  interaction:
    kind: concat
    hidden_dim: 128
    dropout: 0.1
  zero_init_residual: false
  variance_normalized_residual: false
  use_prior_anchor: false

loss:
  beta_mse_weight: 1.0
  residual_huber_weight: 0.0
  shrinkage_weight: 0.0
  standardized_residual_huber_weight: 0.0
  standardized_shrinkage_weight: 0.0
  sigma_min: 0.05
  locus_pearson_weight: 0.15
  locus_min_observed_samples: 8

training:
  seed: 17
  epochs: 80
  learning_rate: 5.0e-5
  weight_decay: 1.0e-4
  scheduler: constant
  scheduler_horizon_epochs: 80
  warmup_epochs: 0.0
  min_lr_ratio: 0.1
  gradient_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
  allow_tf32: true
  matmul_precision: high
  fused_adamw: true

structured_loss_sources: [array, epic, wgbs]

batching:
  array: {sample_size: 512, cpg_size: 512}
  epic: {sample_size: 128, cpg_size: 4096}
  wgbs: {sample_size: 32, cpg_size: 16384}

tracking:
  backend: wandb
  project: MethylPredictor
  group: null
  name: null
  job_type: train
  tags: [ablation, prior-anchor, direct-prediction]
  mode: online
  log_every_steps: 25
  watch_model: false
  log_checkpoint: false
