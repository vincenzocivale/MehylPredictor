# RNA-encoder-comparison harness (post-2026-09-05 pivot, docs/RNA_METHYLATION.md's
# "Forward direction"): MethylProphet-style RNA encoder, trained from scratch in place
# of the current encoder. Matched on EVERY training hyperparameter to
# p0_row_b_locus_attention_matched.yaml (the actual "row B" recipe behind the official
# numbers cited in docs/RNA_METHYLATION.md, NOT the older enc_mlp.yaml/
# enc_locus_attention_k64.yaml arch_suite-ladder protocol, which predates the
# 2026-09-05 pivot and uses different lr/scheduler/schedule_layout -- an earlier
# version of this file was cloned from that wrong template) -- only model.encoder and
# tracking.tags differ from p0_row_b_locus_attention_matched.yaml below.
#
# Reproduces the *architecture* of MethylProphet's published RNA branch
# (bioRxiv 2025.02.05.636730, github.com/xk-huang/methylprophet, BottleneckMLP
# "B_6-Wi_1024": 6 pre-norm residual blocks, width 1024, inner width 4096,
# GELU, x = x + Linear(GELU(Linear(LayerNorm(x))))) -- see
# models.py::BottleneckMLPEncoder. Explicitly NOT their preprocessing
# (log-quantize to [0,1]) or their fusion (DistilBERT token concatenation):
# this encoder consumes the same frozen z-scored 25017-gene RNA cache and
# plugs into this harness's existing fixed branch/fusion architecture as a
# locus-invariant global vector, isolating the encoder architecture as the
# only variable against row B.
#
# schedule_layout=contiguous_blocks + prefetch_depth=2 (prefetch_workers left
# at its default of 1) is the actual "optimized" pipeline row B itself was
# trained with -- NOT a further-cranked prefetch_workers=4/depth=8 an earlier
# version of this file tried: that untested combination hung (0% GPU
# utilization, no progress after 9+ minutes) on this structured
# pair_complete/array+epic+wgbs pipeline, which prefetch_workers>1 was never
# verified against (only the now-deleted flat-batching "_aggressive" recipes
# used prefetch_workers=4, a different code path). Match row B's proven
# settings here rather than an unverified "more must be faster" guess.
model:
  encoder:
    kind: bottleneck_mlp
    latent_dim: 256
    hidden_dim: 1024
    n_blocks: 6
    mlp_ratio: 4
    dropout: 0.1
    layer_norm: true
  interaction:
    kind: concat
    hidden_dim: 128
    dropout: 0.1
  zero_init_residual: true
  variance_normalized_residual: true
loss:
  beta_mse_weight: 1.0
  residual_huber_weight: 0.0
  shrinkage_weight: 0.0
  standardized_residual_huber_weight: 0.1
  standardized_residual_huber_delta: 1.0
  standardized_shrinkage_weight: 1.0e-4
  sigma_min: 0.05
  locus_pearson_weight: 0.15
  locus_min_observed_samples: 8

training:
  seed: 17
  device: auto
  epochs: 80
  steps_per_epoch: 250
  sample_batch_size: 32
  cpg_batch_size: 256
  learning_rate: 2.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine_warmup
  scheduler_horizon_epochs: 80
  warmup_epochs: 1.0
  min_lr_ratio: 0.1
  gradient_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
  allow_tf32: true
  matmul_precision: high
  fused_adamw: true
  patience: 15
  min_delta: 1.0e-05
  num_workers: 0
  schedule_layout: contiguous_blocks
  prefetch_depth: 2
  hdf5_cache_mb: 256
  checkpoint_every: 1
  compile: false
  validation_sample_split: validation
  validation_cpg_split: validation
  train_sample_split: train
  train_cpg_split: train
  checkpoint_metric: mse
  validation_every: 1
  validation_max_cpgs: 512
  min_epochs: 0
  save_every_epoch: false
  cpg_sampling: uniform
  checkpoint_selection: best

schedule_policy: pair_complete
exclude_official_val_from_auxiliary: true
structured_loss_sources: [array, epic, wgbs]

locus_cls:
  use_mean_branch: true
  use_fusion_product: false
  fusion_init_std: 0.01
  aux_weight: 0.15
  residual_aux_weight: 0.0
  raw_lr_multiplier: 1.0
  trunk_hidden_dim: 256
  bottleneck_dim: 64

batching:
  array: {sample_size: 640, cpg_size: 640}
  epic: {sample_size: 160, cpg_size: 5120}
  wgbs: {sample_size: 32, cpg_size: 20480}

development:
  fraction: 0.10
  block_bp: 5000000

tracking:
  backend: none
  tags: [arch-novelty, encoder, bottleneck-mlp, methylprophet-style, matched-budget]
