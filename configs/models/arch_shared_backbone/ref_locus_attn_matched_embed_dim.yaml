# Notation-motivated variant of the reference recipe
# (configs/models/rna_methylation_locus_attention.yaml, == the
# ref-locus-attn-k64-noproduct-seed{17,29,43} runs). Byte-for-byte identical
# except locus_cls.bottleneck_dim: 64 -> 128.
#
# Why: a co-author asked, purely for paper notation, whether the two branch
# embeddings that get concatenated at fusion time (h_mean from CpGTrunk,
# h_raw from the raw/RNA-conditioned branch) could be made the same
# dimension, so the fusion step reads as "concat two R^d vectors" instead of
# "concat R^64 and R^128". This recipe raises h_mean's dimension
# (locus_cls.bottleneck_dim) up to h_raw's (model.interaction.hidden_dim=128)
# rather than shrinking h_raw down, to avoid reducing the raw branch's
# established capacity. No architecture code change was needed --
# bottleneck_dim was already a free hyperparameter
# (FeatureFusionArchitectureVariantModel's CpGTrunk bottleneck), so this is
# purely a config-level ablation cell.
#
# Compare directly against ref-locus-attn-k64-noproduct-seed17 (identical
# recipe, bottleneck_dim=64) -- same seed, same matched_chr1_shared_backbone
# protocol, same evaluate_official_split views -- to see whether matching
# the embedding dimensions changes chr1 performance.
model:
  encoder:
    kind: locus_attention
    latent_dim: 256
    n_programs: 64
    program_dim: 256
    n_heads: 4
    dropout: 0.1
    layer_norm: true
  interaction:
    kind: concat
    hidden_dim: 128
    dropout: 0.1
  zero_init_residual: true
  variance_normalized_residual: true
loss:
  beta_mse_weight: 1.0
  residual_huber_weight: 0.0
  shrinkage_weight: 0.0
  standardized_residual_huber_weight: 0.1
  standardized_residual_huber_delta: 1.0
  standardized_shrinkage_weight: 1.0e-4
  sigma_min: 0.05
  locus_pearson_weight: 0.15
  locus_min_observed_samples: 8

training:
  seed: 17
  device: auto
  epochs: 80
  steps_per_epoch: 250
  sample_batch_size: 32
  cpg_batch_size: 256
  learning_rate: 2.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine_warmup
  scheduler_horizon_epochs: 80
  warmup_epochs: 1.0
  min_lr_ratio: 0.1
  gradient_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
  allow_tf32: true
  matmul_precision: high
  fused_adamw: true
  patience: 15
  min_delta: 1.0e-05
  num_workers: 0
  schedule_layout: contiguous_blocks
  prefetch_depth: 8
  prefetch_workers: 4
  hdf5_cache_mb: 256
  checkpoint_every: 1
  compile: false
  validation_sample_split: validation
  validation_cpg_split: validation
  train_sample_split: train
  train_cpg_split: train
  checkpoint_metric: mse
  validation_every: 1
  validation_max_cpgs: 512
  min_epochs: 0
  save_every_epoch: false
  cpg_sampling: uniform
  checkpoint_selection: best

schedule_policy: pair_complete
exclude_official_val_from_auxiliary: true
structured_loss_sources: [array, epic, wgbs]

locus_cls:
  use_mean_branch: true
  use_fusion_product: false
  use_raw_product: false
  fusion_init_std: 0.01
  aux_weight: 0.15
  residual_aux_weight: 0.0
  raw_lr_multiplier: 1.0
  trunk_hidden_dim: 256
  bottleneck_dim: 128

batching:
  array: {sample_size: 640, cpg_size: 640}
  epic: {sample_size: 160, cpg_size: 5120}
  wgbs: {sample_size: 32, cpg_size: 20480}

development:
  fraction: 0.10
  block_bp: 5000000

tracking:
  backend: wandb
  project: MethylPredictor
  mode: online
  group: rna_methylation_locus_attention_matched_embed_dim
  job_type: train
  tags: [reference, locus-attention, no-product, matched-embed-dim, notation-ablation]
