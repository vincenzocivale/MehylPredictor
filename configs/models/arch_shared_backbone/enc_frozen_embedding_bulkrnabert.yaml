# RNA-encoder-comparison harness (post-2026-09-05 pivot, docs/RNA_METHYLATION.md's
# "Forward direction"): frozen pretrained transcriptome foundation-model embedding
# (BulkRNABert, TCGA-pretrained checkpoint) adapted by a single trainable Linear
# projection, in place of a from-scratch-trained encoder. Matched on EVERY training
# hyperparameter to p0_row_b_locus_attention_matched.yaml (the actual "row B" recipe
# behind the official numbers cited in docs/RNA_METHYLATION.md, NOT the older
# enc_mlp.yaml/enc_locus_attention_k64.yaml arch_suite-ladder protocol, which predates
# the 2026-09-05 pivot and uses a different lr/scheduler/schedule_layout -- an earlier
# version of this file was cloned from that wrong template) -- only model.encoder and
# tracking.tags differ from p0_row_b_locus_attention_matched.yaml below.
#
# BulkRNABert (github.com/instadeepai/multiomics-open-research,
# huggingface.co/InstaDeepAI/BulkRNABert, CC BY-NC-SA 4.0 -- NON-COMMERCIAL)
# is a ~6M-parameter transformer pretrained on bulk RNA-seq over a fixed
# 19,062-Ensembl-gene panel, producing a 256-d embedding per sample. The
# transformer itself is NOT trained here -- only
# models.py::FrozenEmbeddingEncoder's LayerNorm+Linear adapter on top is
# trainable. See scripts/prepare_bulkrnabert_embeddings.py for how the
# embedding cache below is generated (must be run before this recipe).
#
# IMPORTANT: unlike every other arm in this harness, this recipe must be run
# with --rna-cache pointing at the BulkRNABert embedding cache directory
# (produced by scripts/prepare_bulkrnabert_embeddings.py: rna_zscore.f16.npy
# holding (n_samples, 256) embeddings -- not a z-score, named that way only
# for RNACache on-disk-format compatibility -- + rna_sample_idx.npy), NOT the
# canonical 25017-gene z-scored cache. input_dim is derived dynamically from
# whichever cache is opened (rna_training/locus_cls_trainer.py), so no other
# change is needed to point this recipe at a different embedding source.
#
# schedule_layout=contiguous_blocks + prefetch_depth=2 (prefetch_workers left
# at its default of 1) is the actual "optimized" pipeline row B itself was
# trained with -- see enc_bottleneck_mlp.yaml's header comment for why a
# higher prefetch_workers was tried and reverted (it hung on this pipeline).
model:
  encoder:
    kind: frozen_embedding
    latent_dim: 256
    dropout: 0.1
    layer_norm: true
    frozen_embedding_source: bulkrnabert_tcga
  interaction:
    kind: concat
    hidden_dim: 128
    dropout: 0.1
  zero_init_residual: true
  variance_normalized_residual: true
loss:
  beta_mse_weight: 1.0
  residual_huber_weight: 0.0
  shrinkage_weight: 0.0
  standardized_residual_huber_weight: 0.1
  standardized_residual_huber_delta: 1.0
  standardized_shrinkage_weight: 1.0e-4
  sigma_min: 0.05
  locus_pearson_weight: 0.15
  locus_min_observed_samples: 8

training:
  seed: 17
  device: auto
  epochs: 80
  steps_per_epoch: 250
  sample_batch_size: 32
  cpg_batch_size: 256
  learning_rate: 2.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine_warmup
  scheduler_horizon_epochs: 80
  warmup_epochs: 1.0
  min_lr_ratio: 0.1
  gradient_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
  allow_tf32: true
  matmul_precision: high
  fused_adamw: true
  patience: 15
  min_delta: 1.0e-05
  num_workers: 0
  schedule_layout: contiguous_blocks
  prefetch_depth: 2
  hdf5_cache_mb: 256
  checkpoint_every: 1
  compile: false
  validation_sample_split: validation
  validation_cpg_split: validation
  train_sample_split: train
  train_cpg_split: train
  checkpoint_metric: mse
  validation_every: 1
  validation_max_cpgs: 512
  min_epochs: 0
  save_every_epoch: false
  cpg_sampling: uniform
  checkpoint_selection: best

schedule_policy: pair_complete
exclude_official_val_from_auxiliary: true
structured_loss_sources: [array, epic, wgbs]

locus_cls:
  use_mean_branch: true
  use_fusion_product: false
  fusion_init_std: 0.01
  aux_weight: 0.15
  residual_aux_weight: 0.0
  raw_lr_multiplier: 1.0
  trunk_hidden_dim: 256
  bottleneck_dim: 64

batching:
  array: {sample_size: 640, cpg_size: 640}
  epic: {sample_size: 160, cpg_size: 5120}
  wgbs: {sample_size: 32, cpg_size: 20480}

development:
  fraction: 0.10
  block_bp: 5000000

tracking:
  backend: none
  tags: [arch-novelty, encoder, frozen-embedding, bulkrnabert, matched-budget]
