# Tier-1 follow-up diagnostic: same as row B (locus attention, no trunk, direct
# readout), but with the raw branch's elementwise RNA*CpG product term AND the
# CpG-only mean-prediction auxiliary branch both removed. Isolates whether row
# B's near-total capture of the A-vs-F gap depends on those two extras
# (inherited unconditionally from FeatureFusionLocusCLSModel) or comes purely
# from the locus-conditioned attention itself.
#
# use_raw_product=false drops p_{s,l}=W_r*r_{s,l} elementwise* W_e*e_l from the
# raw branch's joint representation (models.py::FeatureFusionArchitectureVariantModel,
# use_raw_product constructor flag, added for this diagnostic).
# use_mean_branch=false removes CpGTrunk/mean_head entirely: no locus-only
# baseline branch, no aux_weight MSE-to-logit(mu) supervision, prediction comes
# from h_raw alone through a single Linear(128,1).
model:
  encoder:
    kind: locus_attention
    latent_dim: 256
    n_programs: 64
    program_dim: 256
    n_heads: 4
    dropout: 0.1
    layer_norm: true
  interaction:
    kind: concat
    hidden_dim: 128
    dropout: 0.1
  zero_init_residual: true
  variance_normalized_residual: true
loss:
  beta_mse_weight: 1.0
  residual_huber_weight: 0.0
  shrinkage_weight: 0.0
  standardized_residual_huber_weight: 0.1
  standardized_residual_huber_delta: 1.0
  standardized_shrinkage_weight: 1.0e-4
  sigma_min: 0.05
  locus_pearson_weight: 0.15
  locus_min_observed_samples: 8

training:
  seed: 17
  device: auto
  epochs: 80
  steps_per_epoch: 250
  sample_batch_size: 32
  cpg_batch_size: 256
  learning_rate: 2.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine_warmup
  scheduler_horizon_epochs: 80
  warmup_epochs: 1.0
  min_lr_ratio: 0.1
  gradient_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
  allow_tf32: true
  matmul_precision: high
  fused_adamw: true
  patience: 15
  min_delta: 1.0e-05
  num_workers: 0
  schedule_layout: contiguous_blocks
  prefetch_depth: 2
  hdf5_cache_mb: 256
  checkpoint_every: 1
  compile: false
  validation_sample_split: validation
  validation_cpg_split: validation
  train_sample_split: train
  train_cpg_split: train
  checkpoint_metric: mse
  validation_every: 1
  validation_max_cpgs: 512
  min_epochs: 0
  save_every_epoch: false
  cpg_sampling: uniform
  checkpoint_selection: best

schedule_policy: pair_complete
exclude_official_val_from_auxiliary: true
structured_loss_sources: [array, epic, wgbs]

locus_cls:
  use_mean_branch: false
  use_fusion_product: false
  use_raw_product: false
  fusion_init_std: 0.01
  aux_weight: 0.15
  residual_aux_weight: 0.0
  raw_lr_multiplier: 1.0
  trunk_hidden_dim: 256
  bottleneck_dim: 64

batching:
  array: {sample_size: 640, cpg_size: 640}
  epic: {sample_size: 160, cpg_size: 5120}
  wgbs: {sample_size: 32, cpg_size: 20480}

development:
  fraction: 0.10
  block_bp: 5000000

tracking:
  backend: none
  tags: [arch-novelty, p0-followup, no-product, no-mean-branch]
