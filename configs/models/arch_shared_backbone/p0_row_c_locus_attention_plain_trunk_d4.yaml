# Tier-1 diagnostic (P0 row C): locus attention + parameter-matched PLAIN depth-4 trunk
# (no HC/mHC, no stream semantics) + direct readout. Isolates H2 (capacity/depth alone,
# independent of any multi-stream mixing or manifold constraint) on top of row B's
# locus-conditioned encoder. Same trunk width/depth/expansion as the final mHC model
# (width=128, depth=4, expansion=2) so parameter count is close to F; same training
# hyperparameters as row B / F for a matched-budget comparison.
model:
  encoder:
    kind: locus_attention
    latent_dim: 256
    n_programs: 64
    program_dim: 256
    n_heads: 4
    dropout: 0.1
    layer_norm: true
  interaction:
    kind: concat
    hidden_dim: 128
    dropout: 0.1
  trunk:
    kind: plain
    depth: 4
    width: 128
    expansion: 2
    dropout: 0.1
    gradient_checkpointing: true
  zero_init_residual: true
  variance_normalized_residual: true
loss:
  beta_mse_weight: 1.0
  residual_huber_weight: 0.0
  shrinkage_weight: 0.0
  standardized_residual_huber_weight: 0.1
  standardized_residual_huber_delta: 1.0
  standardized_shrinkage_weight: 1.0e-4
  sigma_min: 0.05
  locus_pearson_weight: 0.15
  locus_min_observed_samples: 8

training:
  seed: 17
  device: auto
  epochs: 80
  steps_per_epoch: 250
  sample_batch_size: 32
  cpg_batch_size: 256
  learning_rate: 2.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine_warmup
  scheduler_horizon_epochs: 80
  warmup_epochs: 1.0
  min_lr_ratio: 0.1
  gradient_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
  allow_tf32: true
  matmul_precision: high
  fused_adamw: true
  patience: 15
  min_delta: 1.0e-05
  num_workers: 0
  schedule_layout: contiguous_blocks
  prefetch_depth: 2
  hdf5_cache_mb: 256
  checkpoint_every: 1
  compile: false
  validation_sample_split: validation
  validation_cpg_split: validation
  train_sample_split: train
  train_cpg_split: train
  checkpoint_metric: mse
  validation_every: 1
  validation_max_cpgs: 512
  min_epochs: 0
  save_every_epoch: false
  cpg_sampling: uniform
  checkpoint_selection: best

schedule_policy: pair_complete
exclude_official_val_from_auxiliary: true
structured_loss_sources: [array, epic, wgbs]

locus_cls:
  use_mean_branch: true
  use_fusion_product: false
  fusion_init_std: 0.01
  aux_weight: 0.15
  residual_aux_weight: 0.0
  raw_lr_multiplier: 1.0
  trunk_hidden_dim: 256
  bottleneck_dim: 64

batching:
  array: {sample_size: 640, cpg_size: 640}
  epic: {sample_size: 160, cpg_size: 5120}
  wgbs: {sample_size: 32, cpg_size: 20480}

development:
  fraction: 0.10
  block_bp: 5000000

tracking:
  backend: none
  tags: [arch-novelty, p0-row-c, locus-attention-plain-trunk-d4, matched-budget]
