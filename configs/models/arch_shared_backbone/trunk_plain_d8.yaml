# arch suite (architecture_novelty_2026_09): trunk depth control.
# The reference architecture combines [h_mean, h_raw] with a SINGLE Linear. This ladder
# (depth 2/4/8, plain pre-norm residual, single stream) deepens the already-concatenated
# joint representation before the final head -- the depth control any HC/mHC claim needs.
# (models.py::FeatureFusionLocusCLSModel via rna_training/locus_cls_trainer.py,
# --engine matched_chr1_shared_backbone in scripts/train.py).
#
# This is the repo's primary/reference RNA-methylation architecture as of
# 2026-09-03 (see docs/RNA_METHYLATION.md), replacing the (since removed) two-stage
# frozen-prior + residual pipeline (VarianceNormalizedResidualModel/
# RNAMethylationPredictor -- see CLAUDE.md's "Model compatibility note"). Selected via the shared_backbone_locus_cls_2026_09
# ablation ladder (results/reference/ablations.yaml): a mean-prediction proxy
# branch (CpGTrunk) late-fused (concatenation, no product term) with an
# RNA-conditioned branch into a single prediction head -- the simplest
# configuration in the ladder, confirmed on the true official chr1 split at
# MAS-PCC 0.5627 (epoch 47/80, not yet run to convergence).
#
# schedule_policy=pair_complete matches the official matched_chr1 engine's full
# Cartesian sample-block x CpG-block coverage per epoch (same batching as the
# original MethylProphet-matched reference recipe).
model:
  encoder:
    kind: linear
    latent_dim: 256
    layer_norm: true
  interaction:
    kind: concat
    hidden_dim: 128
    dropout: 0.1
  trunk:
    kind: plain
    depth: 8
    width: 128
    expansion: 2
    dropout: 0.1
    gradient_checkpointing: true
  zero_init_residual: true
  variance_normalized_residual: true
loss:
  beta_mse_weight: 1.0
  residual_huber_weight: 0.0
  shrinkage_weight: 0.0
  standardized_residual_huber_weight: 0.1
  standardized_residual_huber_delta: 1.0
  standardized_shrinkage_weight: 1.0e-4
  sigma_min: 0.05
  locus_pearson_weight: 0.15
  locus_min_observed_samples: 8

training:
  seed: 17
  epochs: 80
  learning_rate: 5.0e-5
  weight_decay: 1.0e-4
  scheduler: constant
  scheduler_horizon_epochs: 80
  warmup_epochs: 0.0
  min_lr_ratio: 0.1
  gradient_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
  allow_tf32: true
  matmul_precision: high
  fused_adamw: true

schedule_policy: pair_complete
exclude_official_val_from_auxiliary: true
structured_loss_sources: [array, epic, wgbs]

# locus-CLS-specific architecture flags (see FeatureFusionLocusCLSModel/
# LocusCLSJointTrainer) -- the ladder's rung_b configuration: mean branch on,
# concatenation-only fusion, no residual probe, no LR multiplier, default init.
locus_cls:
  use_mean_branch: true
  use_fusion_product: false
  fusion_init_std: 0.01
  aux_weight: 0.15
  residual_aux_weight: 0.0
  raw_lr_multiplier: 1.0
  trunk_hidden_dim: 256
  bottleneck_dim: 64
  trunk_dropout: 0.1

batching:
  array: {sample_size: 640, cpg_size: 640}
  epic: {sample_size: 160, cpg_size: 5120}
  wgbs: {sample_size: 32, cpg_size: 20480}

development:
  fraction: 0.10
  block_bp: 5000000

tracking:
  backend: none
  tags: [arch-novelty, trunk, plain, d8]
