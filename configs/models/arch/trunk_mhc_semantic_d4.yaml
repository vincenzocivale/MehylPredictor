# arch suite (architecture_novelty_2026_09): mHC with MODALITY streams -- the novel arm.
# In mHC the n streams are anonymous copies of the residual width. Here each stream is
# seeded with a different modality (RNA, CpG, RNA x CpG product, locus prior), so under
# the doubly stochastic constraint H^res becomes a mass-conserving CROSS-MODAL EXCHANGE
# operator: a convex combination of permutations of the modalities, readable per depth
# as an interpretable exchange matrix (models.py::HyperConnectionTrunk.residual_mappings).
# That reading exists only because of the manifold constraint -- an unconstrained HC
# matrix has no conservation interpretation. This is the arm that answers the
# 'architecture is too simple' critique with something beyond 'we applied mHC'.
model:
  encoder:
    kind: linear
    latent_dim: 256
    layer_norm: true
  interaction:
    kind: concat
    hidden_dim: 128
    dropout: 0.1
  trunk:
    kind: mhc
    depth: 4
    width: 128
    expansion: 2
    dropout: 0.1
    n_streams: 4
    stream_semantics: true
    sinkhorn_iters: 20
    identity_init_scale: 4.0
    gradient_checkpointing: true
  zero_init_residual: true
  variance_normalized_residual: true

loss:
  beta_mse_weight: 1.0
  residual_huber_weight: 0.0
  shrinkage_weight: 0.0
  standardized_residual_huber_weight: 0.1
  standardized_residual_huber_delta: 1.0
  standardized_shrinkage_weight: 1.0e-4
  sigma_min: 0.05
  locus_pearson_weight: 0.15
  locus_min_observed_samples: 8

training:
  seed: 17
  epochs: 80
  learning_rate: 5.0e-5
  weight_decay: 1.0e-4
  scheduler: constant
  scheduler_horizon_epochs: 80
  warmup_epochs: 0.0
  min_lr_ratio: 0.1
  gradient_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
  allow_tf32: true
  matmul_precision: high
  fused_adamw: true

structured_loss_sources: [array, epic, wgbs]

batching:
  array: {sample_size: 512, cpg_size: 512}
  epic: {sample_size: 128, cpg_size: 4096}
  wgbs: {sample_size: 32, cpg_size: 16384}

tracking:
  backend: wandb
  project: MethylPredictor
  group: null
  name: null
  job_type: train
  tags: [arch-novelty, trunk, mhc, stream-semantics, d4]
  mode: online
  log_every_steps: 25
  watch_model: false
  log_checkpoint: false
