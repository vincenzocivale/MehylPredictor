# arch suite (architecture_novelty_2026_09): Hyper-Connections (arXiv:2409.19606).
# Four parallel residual streams with UNCONSTRAINED learnable mixing. Compare against
# trunk_plain_d4 (same depth/width, one stream) and trunk_mhc_n4_d4 (same topology,
# constrained mixing). Watch architecture_diagnostics in history.json: HC's composite
# residual mapping has no gain bound, which is the instability mHC exists to fix.
model:
  encoder:
    kind: linear
    latent_dim: 256
    layer_norm: true
  interaction:
    kind: concat
    hidden_dim: 128
    dropout: 0.1
  trunk:
    kind: hc
    depth: 4
    width: 128
    expansion: 2
    dropout: 0.1
    n_streams: 4
    gradient_checkpointing: true
  zero_init_residual: true
  variance_normalized_residual: true

loss:
  beta_mse_weight: 1.0
  residual_huber_weight: 0.0
  shrinkage_weight: 0.0
  standardized_residual_huber_weight: 0.1
  standardized_residual_huber_delta: 1.0
  standardized_shrinkage_weight: 1.0e-4
  sigma_min: 0.05
  locus_pearson_weight: 0.15
  locus_min_observed_samples: 8

training:
  seed: 17
  epochs: 80
  learning_rate: 5.0e-5
  weight_decay: 1.0e-4
  scheduler: constant
  scheduler_horizon_epochs: 80
  warmup_epochs: 0.0
  min_lr_ratio: 0.1
  gradient_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
  allow_tf32: true
  matmul_precision: high
  fused_adamw: true

structured_loss_sources: [array, epic, wgbs]

batching:
  array: {sample_size: 512, cpg_size: 512}
  epic: {sample_size: 128, cpg_size: 4096}
  wgbs: {sample_size: 32, cpg_size: 16384}

tracking:
  backend: wandb
  project: MethylPredictor
  group: null
  name: null
  job_type: train
  tags: [arch-novelty, trunk, hyper-connections, n4, d4]
  mode: online
  log_every_steps: 25
  watch_model: false
  log_checkpoint: false
