# arch suite (architecture_novelty_2026_09): Beta likelihood output head.
# Methylation beta values are bounded in [0, 1] with variance that collapses towards
# both boundaries; a plain MSE treats them as homoscedastic. The model additionally
# emits a per-pair concentration phi and the objective gains the Beta NLL, with the
# anchored prediction as the mean. ADDITIVE, not a replacement: beta_mse stays at 1.0
# so this arm's MAS-PCC remains comparable to every other arm.
# WGBS beta values hit exactly 0 and 1, where the Beta density diverges -- targets are
# clamped by loss.beta_nll_epsilon.
model:
  encoder:
    kind: linear
    latent_dim: 256
    layer_norm: true
  interaction:
    kind: concat
    hidden_dim: 128
    dropout: 0.1
  beta_likelihood_head: true
  zero_init_residual: true
  variance_normalized_residual: true

loss:
  beta_mse_weight: 1.0
  residual_huber_weight: 0.0
  shrinkage_weight: 0.0
  standardized_residual_huber_weight: 0.1
  standardized_residual_huber_delta: 1.0
  standardized_shrinkage_weight: 1.0e-4
  sigma_min: 0.05
  locus_pearson_weight: 0.15
  locus_min_observed_samples: 8
  concentration_min: 2.0
  beta_nll_epsilon: 1.0e-3
  beta_nll_weight: 0.1

training:
  seed: 17
  epochs: 80
  learning_rate: 5.0e-5
  weight_decay: 1.0e-4
  scheduler: constant
  scheduler_horizon_epochs: 80
  warmup_epochs: 0.0
  min_lr_ratio: 0.1
  gradient_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
  allow_tf32: true
  matmul_precision: high
  fused_adamw: true

structured_loss_sources: [array, epic, wgbs]

batching:
  array: {sample_size: 512, cpg_size: 512}
  epic: {sample_size: 128, cpg_size: 4096}
  wgbs: {sample_size: 32, cpg_size: 16384}

tracking:
  backend: wandb
  project: MethylPredictor
  group: null
  name: null
  job_type: train
  tags: [arch-novelty, output-head, beta-likelihood]
  mode: online
  log_every_steps: 25
  watch_model: false
  log_checkpoint: false
