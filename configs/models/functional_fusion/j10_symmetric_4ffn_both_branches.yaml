extends: base.yaml
# Symmetric-depth control (2026-09-12, J10): 4 FFN-only residual blocks on
# EACH branch -- retrieval (`state`, matching J4's depth exactly) AND the
# functional-annotation branch (h_c, from track_embedding+dense_encoder,
# matching that same depth). Different question from J9b's asymmetric 8/8
# (retrieval held at J7's depth): here both axes move together at a
# moderate, matched depth, to see whether functional-branch depth is worth
# it even without also paying for J7's deeper retrieval side. deep_query
# stays False -- the cross-attention query is the shallow, un-deepened h_c,
# same isolation rationale as J9b -- see
# src/methylation_predictor/modeling/ablation.py's
# EfficientSingleAttentionPredictor docstring. Otherwise byte-for-byte
# identical to j4_efficient_single_attn.yaml: mean head, RNA encoder, final
# MLP, loss, optimizer, LR, data pools, seed, epochs, TRUE chr1 mode=final
# protocol.
model:
  functional_fusion_variant: efficient_single_attn_4ffn_residual_functional4
loss:
  beta_mse_weight: 1.0
  residual_huber_weight: 0.0
  shrinkage_weight: 0.0
  standardized_residual_huber_weight: 0.0
  standardized_shrinkage_weight: 0.0
  locus_pearson_weight: 0.15   # lambda_locus_PCC (L_locus_PCC)
  locus_min_observed_samples: 8
  sample_pearson_weight: 0.0
  locus_centered_mse_weight: 0.0
training:
  seed: 17
  epochs: 80
  scheduler_horizon_epochs: 80
  warmup_epochs: 1.0
  min_lr_ratio: 0.1
  learning_rate: 2.0e-4
  weight_decay: 1.0e-4
  gradient_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
locus_cls:
  use_mean_branch: true
  aux_weight: 0.15             # lambda_mean (L_mean)
  residual_aux_weight: 0.0
  final_regressor_dropout: 0.15
batching:
  # Matched to j4_efficient_single_attn.yaml's full J0-J3 batching (no
  # reduction like J7/J9b needed) -- retrieval depth here is only 4 (J4's,
  # not J7's 8), and the 4 extra functional_ffn blocks operate on h_c
  # ([n_loci, WIDTH], not replicated per RNA sample), so expected VRAM is
  # well under J4's already-profiled 16.5GB. Not yet verified empirically;
  # the launch script's smoke test will catch an OOM if this is wrong.
  array: {sample_size: 640, cpg_size: 640}
  epic: {sample_size: 160, cpg_size: 5120}
  wgbs: {sample_size: 32, cpg_size: 20480}
tracking:
  backend: wandb
  project: MethylPredictor
  mode: online
  group: functional_concat_final
  job_type: train
  tags: [functional-only, mas-concat, ablation, efficient-single-attn, 4ffn, functional-branch-depth, symmetric-depth, chr1-final]
