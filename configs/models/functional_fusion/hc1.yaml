extends: base.yaml
# Follow-up to H0/H1/hd1: an RNA-usage diagnostic on H0's checkpoint (variance
# decomposition + RNA-shuffle invariance) showed the model relies overwhelmingly
# on locus identity (93.6% of its own output variance is between-locus) and
# under-uses patient-specific (RNA-driven) signal relative to the true data
# (model's within-locus variance is only 42% of the target's). Plain beta_mse
# under-weights the within-locus component because the target's between-locus
# variance dominates it (~6x). This variant adds locus_centered_mse_weight
# (lambda_centered): MSE computed AFTER centering both prediction and target
# by their own per-batch per-locus mean, so it rewards getting the
# patient-specific deviation right specifically, on top of h1's architecture
# (mas_concat_v1, NOT detached -- hd1's detach showed no benefit on its own).
model: {functional_fusion_variant: mas_concat_v1}
loss:
  locus_pearson_weight: 0.0
  sample_pearson_weight: 0.05
  sample_pearson_min_observed_cpgs: 8
  sample_pearson_epsilon: 1.0e-8
  locus_centered_mse_weight: 1.0
  locus_min_observed_samples: 8
training: {epochs: 40, scheduler_horizon_epochs: 40}
locus_cls:
  use_mean_branch: true
  aux_weight: 0.15
  residual_aux_weight: 0.0
tracking: {backend: wandb, project: MethylPredictor, mode: online, group: mas_concat_sweep, job_type: train, tags: [functional-only, mas-concat-sweep, within-locus-centered-mse]}
