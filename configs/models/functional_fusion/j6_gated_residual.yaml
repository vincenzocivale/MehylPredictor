extends: base.yaml
# Flamingo-style gated residual (2026-09-11, J6): n_blocks=1, same depth as
# ablation_depth1_residual (J2), but the per-block residual add is gated by
# a learned scalar (tanh(alpha), alpha init 0 -- ReZero-style) instead of
# being unconditional. Tests whether letting the model modulate how much of
# the retrieved RNA signal enters the locus state beats the plain add, at
# near-zero extra cost (one scalar parameter). See
# src/methylation_predictor/modeling/ablation.py's module docstring
# (GatedResidualPredictor) for the full rationale, including why this
# doesn't need J1's extra depth to be meaningful (unlike mHC/RealFormer/
# AttnRes). Otherwise byte-for-byte identical to j0_final.yaml/
# j1_iterative.yaml: functional encoder, mean head, RNA encoder, final MLP,
# loss, optimizer, LR, batching, data pools, seed, epochs, TRUE chr1
# mode=final protocol.
model: {functional_fusion_variant: ablation_depth1_gated_residual}
loss:
  beta_mse_weight: 1.0
  residual_huber_weight: 0.0
  shrinkage_weight: 0.0
  standardized_residual_huber_weight: 0.0
  standardized_shrinkage_weight: 0.0
  locus_pearson_weight: 0.15   # lambda_locus_PCC (L_locus_PCC)
  locus_min_observed_samples: 8
  sample_pearson_weight: 0.0
  locus_centered_mse_weight: 0.0
training:
  seed: 17
  epochs: 80
  scheduler_horizon_epochs: 80
  warmup_epochs: 1.0
  min_lr_ratio: 0.1
  learning_rate: 2.0e-4
  weight_decay: 1.0e-4
  gradient_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
locus_cls:
  use_mean_branch: true
  aux_weight: 0.15             # lambda_mean (L_mean)
  residual_aux_weight: 0.0
  final_regressor_dropout: 0.15
batching:
  array: {sample_size: 640, cpg_size: 640}
  epic: {sample_size: 160, cpg_size: 5120}
  wgbs: {sample_size: 32, cpg_size: 20480}
tracking:
  backend: wandb
  project: MethylPredictor
  mode: online
  group: functional_concat_final
  job_type: train
  tags: [functional-only, mas-concat, ablation, gated-residual, chr1-final]
