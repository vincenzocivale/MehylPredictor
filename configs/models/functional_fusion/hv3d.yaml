extends: base.yaml
# Regularization follow-up to hv3: the epoch-7 val_cpg MSE inflection was
# unchanged across every fusion-mechanism intervention tried (detach_h_c
# in hd1, centered-MSE in hc1, separate_concat_norm+locus-wise-PCC in hv3),
# suggesting a generic capacity/regularization cause rather than the fusion
# design itself. final_regressor (512->256->128->1, the highest-capacity
# module on the direct beta_hat path) had NO dropout at all -- this variant
# adds it, keeping hv3's architecture (separate_concat_norm, lambda_MAC
# locus-wise PCC) otherwise identical.
model: {functional_fusion_variant: mas_concat_v3_purecontext}
loss:
  locus_pearson_weight: 0.15
  sample_pearson_weight: 0.0
  locus_centered_mse_weight: 0.0
  locus_min_observed_samples: 8
training: {epochs: 40, scheduler_horizon_epochs: 40}
locus_cls:
  use_mean_branch: true
  aux_weight: 0.15
  residual_aux_weight: 0.0
  final_regressor_dropout: 0.15
tracking: {backend: wandb, project: MethylPredictor, mode: online, group: mas_concat_sweep, job_type: train, tags: [functional-only, mas-concat-sweep, purecontext, locus-pcc, dropout]}
