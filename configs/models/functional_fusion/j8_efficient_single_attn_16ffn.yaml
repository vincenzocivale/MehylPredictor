extends: base.yaml
# Efficient single-attention, 16-FFN candidate (2026-09-12, J8): single
# locus<-RNA cross-attention + residual add, followed by 16 FFN-only
# residual blocks -- double J7's 8, to see whether the FFN/residual-depth
# benefit (ablation_depth8_residual/J5 beating J1's depth 4, per live W&B
# observation, not yet an official-split number) continues past 8 or
# plateaus/reverses. A full 16-block (attn+ffn each) variant would need
# ~72GB alone (see modeling/ablation.py's module docstring's measured
# VRAM-vs-n_blocks scaling) -- not practical on a single GPU this size, so
# this efficient form (1x attention, 16x cheap FFN) is the only feasible
# way to test this depth here at all.
#
# array sample_size cut further than J7's (320 -> 160): J7 (8 FFN blocks,
# batch 320) measured 14.13GB peak; doubling the FFN stack again is a
# meaningfully bigger jump than the 4->8 step was (each extra FFN block
# doesn't multiply cheaply -- the unchunked array pool holds every block's
# activations for backprop, so cost is ~linear in n_ffn_blocks). Cutting
# the batch again pre-emptively rather than repeating the OOM cycle from
# J7's first attempt.
#
# NOTE on wall-clock: J7's own smoke test (608s/epoch, batch 320) came in
# ~3.4x slower than J4's (179s/epoch, batch 640, n_ffn_blocks=4), but that
# compares two changed variables at once (FFN depth AND batch size) -- an
# earlier assumption on this same machine, that batch size doesn't affect
# wall-clock here, held for DOUBLING batch (j4_efficient_single_attn.yaml's
# batching comment) but has NOT been verified for halving it (more,
# smaller steps could add real per-step overhead in the other direction).
# Don't assume J8's wall-clock from FLOPs alone; read its own smoke number.
#
# Otherwise byte-for-byte identical to j0_final.yaml/j1_iterative.yaml:
# functional encoder, mean head, RNA encoder, final MLP, loss, optimizer,
# LR, data pools, seed, epochs, TRUE chr1 mode=final protocol.
model: {functional_fusion_variant: efficient_single_attn_16ffn_residual}
loss:
  beta_mse_weight: 1.0
  residual_huber_weight: 0.0
  shrinkage_weight: 0.0
  standardized_residual_huber_weight: 0.0
  standardized_shrinkage_weight: 0.0
  locus_pearson_weight: 0.15   # lambda_locus_PCC (L_locus_PCC)
  locus_min_observed_samples: 8
  sample_pearson_weight: 0.0
  locus_centered_mse_weight: 0.0
training:
  seed: 17
  epochs: 80
  scheduler_horizon_epochs: 80
  warmup_epochs: 1.0
  min_lr_ratio: 0.1
  learning_rate: 2.0e-4
  weight_decay: 1.0e-4
  gradient_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
locus_cls:
  use_mean_branch: true
  aux_weight: 0.15             # lambda_mean (L_mean)
  residual_aux_weight: 0.0
  final_regressor_dropout: 0.15
batching:
  # Deliberately NOT protocol-matched to J0-J7's batching -- see the note
  # above. array sample_size cut to 160 (1/4 of J0-J6's 640, half of J7's
  # 320) pre-emptively for VRAM; treat cross-cell comparisons accordingly.
  array: {sample_size: 160, cpg_size: 640}
  epic: {sample_size: 160, cpg_size: 5120}
  wgbs: {sample_size: 32, cpg_size: 20480}
tracking:
  backend: wandb
  project: MethylPredictor
  mode: online
  group: functional_concat_final
  job_type: train
  tags: [functional-only, mas-concat, ablation, efficient-single-attn, 16ffn, chr1-final]
