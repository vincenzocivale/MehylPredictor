extends: base.yaml
# Two precise follow-up hypotheses on H0/hc1's RNA-shuffle diagnostic (model
# uses only ~34-35% of the true within-locus/patient-specific variance):
#
# 1. mas_concat_v3_purecontext: r_pc = MHA(Q=h_c, K=RNA, V=RNA) already has
#    NO +h_c residual (confirmed by test_cross_attention_has_no_h_c_residual)
#    -- but z_pc previously concatenated raw h_c with raw r_pc at mismatched
#    scales. separate_concat_norm=true now applies LayerNorm to each
#    independently right before concat, so the final MLP can't trivially
#    prefer the higher-norm modality.
# 2. lambda_MAC: swap the correlation term from sample_pearson_weight
#    (per-patient, across-CpG -- MAC direction) to locus_pearson_weight
#    (per-CpG, across-patient -- rho_c = corr_p(beta_hat, beta) for fixed c).
#    A locus-only shortcut beta_hat=f(h_c) has zero across-patient variance
#    for any fixed c, so this term literally cannot be improved by ignoring
#    RNA. No centered-MSE, no residual Huber, no sample_pearson -- just
#    beta_mse + lambda_mean*L_mean + lambda_MAC*L_locus_PCC, per the spec.
model: {functional_fusion_variant: mas_concat_v3_purecontext}
loss:
  locus_pearson_weight: 0.15   # lambda_MAC
  sample_pearson_weight: 0.0
  locus_centered_mse_weight: 0.0
  locus_min_observed_samples: 8
training: {epochs: 40, scheduler_horizon_epochs: 40}
locus_cls:
  use_mean_branch: true
  aux_weight: 0.15
  residual_aux_weight: 0.0
tracking: {backend: wandb, project: MethylPredictor, mode: online, group: mas_concat_sweep, job_type: train, tags: [functional-only, mas-concat-sweep, purecontext, locus-pcc]}
