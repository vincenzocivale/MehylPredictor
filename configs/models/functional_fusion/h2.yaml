extends: base.yaml
# Focused experiment (docs/RNA_METHYLATION.md's sample-wise-Pearson section):
# H0/H1/H2 loss sweep, architecture held IDENTICAL across the three
# (FunctionalConcatMASModel -- concat-based final regressor, no product/
# residual composition, auxiliary raw-beta-scale mean head). Only
# loss.sample_pearson_weight (lambda_mas) differs between h0/h1/h2.
# 40 fixed epochs / horizon 40 per this experiment's explicit protocol (note:
# this differs from the G0-G4 ladder's own 20-epoch practice, settled after
# G0's first attempt showed val MSE rising past ~epoch 8 at 40 epochs -- kept
# at the requested 40 here per this experiment's explicit spec, not reduced).
model: {functional_fusion_variant: mas_concat_v1}
loss:
  locus_pearson_weight: 0.0    # unused by mas_concat_v1's own loss function; zeroed for provenance clarity
  sample_pearson_weight: 0.10
  sample_pearson_min_observed_cpgs: 8
  sample_pearson_epsilon: 1.0e-8
training: {epochs: 40, scheduler_horizon_epochs: 40}
locus_cls:
  use_mean_branch: true
  aux_weight: 0.15
  residual_aux_weight: 0.0
tracking: {backend: wandb, project: MethylPredictor, mode: online, group: mas_concat_sweep, job_type: train, tags: [functional-only, mas-concat-sweep]}
