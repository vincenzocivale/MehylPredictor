# Ablation-only copy of rna_methylation.yaml with schedule_policy=pair_complete
# (matches the official matched_chr1 engine's full Cartesian sample-block x
# CpG-block coverage per epoch, instead of the lighter axis_full_coverage used
# by today's other ablation-suite runs) and moderately larger batches to cut
# step count (fewer Python-loop/kernel-launch/optimizer-step overheads per
# epoch) without inflating per-step memory too aggressively -- 685 steps/epoch
# vs the official 1514 (still the same *total* Cartesian coverage, just chunked
# into fewer, larger blocks). Same LR/scheduler/epochs as canonical -- delete
# alongside the rest of the locus-CLS ablation once it concludes.
model:
  encoder:
    kind: linear
    latent_dim: 256
    layer_norm: true
  interaction:
    kind: concat
    hidden_dim: 128
    dropout: 0.1
  zero_init_residual: true
  variance_normalized_residual: true

loss:
  beta_mse_weight: 1.0
  residual_huber_weight: 0.0
  shrinkage_weight: 0.0
  standardized_residual_huber_weight: 0.1
  standardized_residual_huber_delta: 1.0
  standardized_shrinkage_weight: 1.0e-4
  sigma_min: 0.05
  locus_pearson_weight: 0.15
  locus_min_observed_samples: 8

training:
  seed: 17
  epochs: 80
  learning_rate: 5.0e-5
  weight_decay: 1.0e-4
  scheduler: constant
  scheduler_horizon_epochs: 80
  warmup_epochs: 0.0
  min_lr_ratio: 0.1
  gradient_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
  allow_tf32: true
  matmul_precision: high
  fused_adamw: true

schedule_policy: pair_complete
exclude_official_val_from_auxiliary: true
structured_loss_sources: [array, epic, wgbs]

batching:
  array: {sample_size: 640, cpg_size: 640}
  epic: {sample_size: 160, cpg_size: 5120}
  wgbs: {sample_size: 32, cpg_size: 20480}

development:
  fraction: 0.10
  block_bp: 5000000

tracking:
  backend: none
