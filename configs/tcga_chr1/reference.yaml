# Canonical TCGA chromosome-1 development reference: variance-normalized
# residual, on top of the V2/V3 fixes (leakage-safe train-CpG prior +
# locus-PCC loss term). See docs/BENCHMARK_TABLE5.md for the full V0-V3
# experiment chain and docs/TCGA_CHR1_EXPERIMENTS.md for current development.
# "Table 5" is retained only inside legacy protocol/cache identifiers below
# for provenance; it is not the experiment identity.
run_name: tcga-chr1-reference
output_dir: /raid/DATASETS/MethylPredictionData/experiments/MethylPredictor/tcga_chr1/reference

data:
  rna:
    path: /raid/DATASETS/MethylPredictionData/datasets/methylprophet_repro_v1/rna/tcga_rna_official_full.h5
    values_key: X
    row_ids_key: sample_idx
    col_ids_key: gene_ids
  methylation:
    path: /raid/DATASETS/MethylPredictionData/datasets/methylprophet_repro_v1/methylation/tcga_array_official_full.h5
    values_key: beta
    row_ids_key: sample_idx
    col_ids_key: cpg_idx
  locus_embeddings:
    path: /raid/DATASETS/MethylPredictionData/derived/methylprophet_table5_tcga_chr1/evaluation_adapter/array_chr1_embeddings.h5
    values_key: embeddings
    row_ids_key: cpg_idx
  locus_features:
    path: /raid/DATASETS/MethylPredictionData/derived/methylprophet_table5_tcga_chr1/table5_genomic_prior/locus_features.parquet
    id_column: cpg_idx
  sample_metadata:
    path: /raid/DATASETS/MethylPredictionData/derived/methylprophet_table5_tcga_chr1/evaluation_adapter/manifests/sample_metadata.parquet
    id_column: sample_idx
  cpg_splits:
    path: /raid/DATASETS/MethylPredictionData/derived/methylprophet_table5_tcga_chr1/evaluation_adapter/manifests/cpg_splits.parquet
    id_column: cpg_idx
  rna_control: real
  rna_transform: zscore
  standardize_rna: true
  clip_beta_epsilon: 1.0e-4
  allow_partial_overlap: false

model:
  encoder:
    kind: linear
    latent_dim: 256
    layer_norm: true
  interaction:
    kind: concat
    hidden_dim: 128
    dropout: 0.1
  zero_init_residual: true
  variance_normalized_residual: true

# V1: logit_pred = mu_i + sigma_i * raw_delta, raw_delta trained on the
# sigma-standardized target instead of the flat delta_logit. The old
# (unstandardized) residual_huber_weight/shrinkage_weight are disabled here
# (set to 0) so the two objectives aren't stacked redundantly -- their values
# are transplanted onto the standardized_* counterparts below.
# beta_mse_weight and locus_pearson_weight are unchanged from V2/V3, carrying
# those gains forward; beta_mse stays the dominant guardrail term.
loss:
  beta_mse_weight: 1.0
  residual_huber_weight: 0.0
  shrinkage_weight: 0.0
  standardized_residual_huber_weight: 0.1
  standardized_residual_huber_delta: 1.0
  standardized_shrinkage_weight: 1.0e-4
  sigma_min: 0.05
  locus_pearson_weight: 0.15
  locus_min_observed_samples: 8
  locus_pearson_min_target_std: 0.0

training:
  seed: 17
  device: auto
  epochs: 1  # operational placeholder; launcher supplies the frozen budget
  learning_rate: 2.0e-5
  weight_decay: 1.0e-4
  gradient_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
  allow_tf32: true
  matmul_precision: high
  fused_adamw: true
  sample_batch_size: 64
  cpg_batch_size: 2048
  steps_per_epoch: 1
  patience: 0
  checkpoint_metric: mas_pcc
  validation_every: 0
  validation_max_cpgs: null

evaluation:
  sample_chunk_size: 128
  cpg_chunk_size: 2048
  max_cpgs_per_panel: null
  save_predictions: false
  panels: {}

tracking:
  backend: wandb
  project: MethylPredictor
  group: tcga-chr1-development
  name: tcga-chr1-reference
  job_type: train
  tags: ["tcga-chr1", "rna256", "variance-normalized", "pair-complete"]
  mode: online
  log_every_steps: 10
  watch_model: false
  log_checkpoint: false
