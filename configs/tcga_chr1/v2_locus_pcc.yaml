# Paper-final MethylProphet Table-5 configuration. The launcher fixes the epoch budget before training
# and overrides it on the command line; no held-out Array data select checkpoints.
run_name: methylprophet-table5-tcga-chr1-seed17
output_dir: /raid/DATASETS/MethylPredictionData/experiments/final_model/methylprophet_table5_tcga_chr1/seed17

data:
  # These paths are the evaluation adapter generated by
  # scripts/tcga_chr1/prepare.py. The one-stage mixed-source trainer
  # reads its optimized derived caches directly; keeping a standard DataConfig
  # here lets the independent MP evaluator load the exact same final checkpoint.
  rna:
    path: /raid/DATASETS/MethylPredictionData/datasets/methylprophet_repro_v1/rna/tcga_rna_official_full.h5
    values_key: X
    row_ids_key: sample_idx
    col_ids_key: gene_ids
  methylation:
    path: /raid/DATASETS/MethylPredictionData/datasets/methylprophet_repro_v1/methylation/tcga_array_official_full.h5
    values_key: beta
    row_ids_key: sample_idx
    col_ids_key: cpg_idx
  locus_embeddings:
    path: /raid/DATASETS/MethylPredictionData/derived/methylprophet_table5_tcga_chr1/evaluation_adapter/array_chr1_embeddings.h5
    values_key: embeddings
    row_ids_key: cpg_idx
  locus_features:
    path: /raid/DATASETS/MethylPredictionData/derived/methylprophet_table5_tcga_chr1/table5_genomic_prior/locus_features.parquet
    id_column: cpg_idx
  sample_metadata:
    path: /raid/DATASETS/MethylPredictionData/derived/methylprophet_table5_tcga_chr1/evaluation_adapter/manifests/sample_metadata.parquet
    id_column: sample_idx
  cpg_splits:
    path: /raid/DATASETS/MethylPredictionData/derived/methylprophet_table5_tcga_chr1/evaluation_adapter/manifests/cpg_splits.parquet
    id_column: cpg_idx
  rna_control: real
  rna_transform: zscore
  standardize_rna: true
  clip_beta_epsilon: 1.0e-4
  allow_partial_overlap: false

model:
  encoder:
    kind: linear
    latent_dim: 256
    layer_norm: true
  interaction:
    kind: concat
    hidden_dim: 128
    dropout: 0.1
  zero_init_residual: true

# V0 objective (architecture-selection baseline) plus one opt-in addition:
# locus_pearson_weight. Per-CpG within-block Pearson correlation (already
# implemented in losses.py, previously always zero-weighted here) directly
# targets the headline metric (median across-sample Pearson per CpG), which
# equal-weights every locus regardless of its inter-sample variance -- unlike
# beta_mse, which a stratified-error analysis showed implicitly over-weights
# high-variance loci. beta_mse stays the dominant term (guardrail against
# scale/calibration drift); this is additive, not a replacement. See
# docs/METHYLPROPHET_TABLE5.md and the V2 experiment note below.
loss:
  beta_mse_weight: 1.0
  residual_huber_weight: 0.1
  residual_huber_delta: 1.0
  shrinkage_weight: 1.0e-4
  locus_pearson_weight: 0.15
  locus_min_observed_samples: 8

training:
  seed: 17
  device: auto
  epochs: 1  # operational placeholder; launcher supplies the frozen budget
  learning_rate: 2.0e-5
  weight_decay: 1.0e-4
  gradient_clip_norm: 1.0
  amp: true
  amp_dtype: bfloat16
  allow_tf32: true
  matmul_precision: high
  fused_adamw: true
  # Generic trainer fields retained only for config-schema compatibility.
  sample_batch_size: 64
  cpg_batch_size: 2048
  steps_per_epoch: 1
  patience: 0
  checkpoint_metric: mas_pcc
  validation_every: 0
  validation_max_cpgs: null

# Exact final views are evaluated after the fixed training budget.
evaluation:
  sample_chunk_size: 128
  cpg_chunk_size: 2048
  max_cpgs_per_panel: null
  save_predictions: false
  panels: {}

tracking:
  backend: wandb
  project: MethylPredictor
  group: paper-final-methylprophet-table5-tcga-chr1
  name: table5-rna256-product-seed17
  job_type: train
  tags: ["paper-final", "methylprophet-table5", "tcga-mix-chr1", "rna256", "residual-prior", "pair-complete", "seed17"]
  mode: online
  log_every_steps: 10
  watch_model: false
  # Avoid inline artifact upload stalls; final.pt is local and can be uploaded post-hoc.
  log_checkpoint: false
