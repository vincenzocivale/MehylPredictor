run_name: bulkrnabert_gtex_encode_tcga_intrinsic
output_dir: artifacts/rna_encoder_quality/bulkrnabert_gtex_encode_tcga

# Corrected R5.2 export: full 19,062-gene input and all four frozen layers.
embeddings:
  path: artifacts/rna_branch/pretrained/bulkrnabert_gtex_encode_v2.h5
  row_ids_key: sample_idx
  layers:
    # Re-extractions made with this patch also contain the pre-Transformer
    # control: uncomment after confirming embeddings_layer0 exists.
    layer0: embeddings_layer0
    layer1: embeddings_layer1
    layer2: embeddings_layer2
    layer3: embeddings_layer3
    layer4: embeddings_layer4

# Full-gene log2(TPM+1) source. The audit selects reconstruction genes using
# train-only variance; it never reads methylation values.
rna:
  path: artifacts/rna_branch/pretrained/inputs/tcga_rna_full_gene.h5
  values_key: X
  row_ids_key: sample_idx
  col_ids_key: gene_ids

metadata:
  path: artifacts/rna_branch/2026-07-29_first_benchmark/inputs/sample_metadata.parquet
  id_column: sample_idx
  cancer_column: cancer_type
  split_column: split
  train_values: [train]
  validation_values: [validation, val]
  test_values: [test]

analysis:
  seed: 17
  chunk_size: 128
  reconstruction_gene_count: 4096
  pca_dimensions: [64, 256]
  random_projection_dim: 256
  ridge_alphas: [0.01, 0.1, 1.0, 10.0, 100.0]
  knn_k: 15
  pair_sample_count: 50000
  geometry_splits: [train, validation, test, all]
  token_ridge_alphas: [0.01, 0.1, 1.0, 10.0]
  token_global_pc_count: 8
  allow_partial_overlap: false

# Enable after re-extracting with --token-sample-output (see docs).
token_embeddings:
  path: artifacts/rna_encoder_quality/inputs/bulkrnabert_token_sample.h5
  sample_ids_key: sample_idx
  gene_ids_key: gene_ids
  expression_key: expression_log2p1
  token_ids_key: token_ids
  layers:
    layer0: tokens_layer0
    layer1: tokens_layer1
    layer2: tokens_layer2
    layer3: tokens_layer3
    layer4: tokens_layer4
stability_views:
  - path: artifacts/rna_encoder_quality/technical_views/multinomial_50pct_embeddings.h5
    name: multinomial_50pct
    layers:
      layer0: embeddings_layer0
      layer1: embeddings_layer1
      layer2: embeddings_layer2
      layer3: embeddings_layer3
      layer4: embeddings_layer4
  - path: artifacts/rna_encoder_quality/technical_views/gene_dropout_5pct_embeddings.h5
    name: gene_dropout_5pct
    layers:
      layer0: embeddings_layer0
      layer1: embeddings_layer1
      layer2: embeddings_layer2
      layer3: embeddings_layer3
      layer4: embeddings_layer4

perturbation_views:
  - path: artifacts/rna_encoder_quality/module_perturbations/extract_hallmark_hypoxia_embeddings.h5
    name: hallmark_hypoxia
    control: hallmark_hypoxia_random
    layers:
      layer0: embeddings_layer0
      layer1: embeddings_layer1
      layer2: embeddings_layer2
      layer3: embeddings_layer3
      layer4: embeddings_layer4
  - path: artifacts/rna_encoder_quality/module_perturbations/extract_hallmark_hypoxia_random_matched_embeddings.h5
    name: hallmark_hypoxia_random
    layers:
      layer0: embeddings_layer0
      layer1: embeddings_layer1
      layer2: embeddings_layer2
      layer3: embeddings_layer3
      layer4: embeddings_layer4
  - path: artifacts/rna_encoder_quality/module_perturbations/extract_hallmark_e2f_targets_embeddings.h5
    name: hallmark_e2f_targets
    control: hallmark_e2f_targets_random
    layers:
      layer0: embeddings_layer0
      layer1: embeddings_layer1
      layer2: embeddings_layer2
      layer3: embeddings_layer3
      layer4: embeddings_layer4
  - path: artifacts/rna_encoder_quality/module_perturbations/extract_hallmark_e2f_targets_random_matched_embeddings.h5
    name: hallmark_e2f_targets_random
    layers:
      layer0: embeddings_layer0
      layer1: embeddings_layer1
      layer2: embeddings_layer2
      layer3: embeddings_layer3
      layer4: embeddings_layer4
