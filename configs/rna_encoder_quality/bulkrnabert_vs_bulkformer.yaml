run_name: bulkrnabert_vs_bulkformer_tcga_intrinsic_locked
output_dir: artifacts/rna_encoder_quality/bulkrnabert_vs_bulkformer/audit

# Exactly one preregistered representation per encoder.
embeddings:
  path: artifacts/rna_encoder_quality/bulkrnabert_vs_bulkformer/embeddings.h5
  row_ids_key: sample_idx
  layers:
    bulkrnabert_concat_means: bulkrnabert__concat_means
    bulkformer147m_official_mean: bulkformer147m__official_mean

# Full-gene log2(TPM+1) source. Genes used as reconstruction targets are selected
# by variance on train only. No methylation, CpG or NTv3 file is read.
rna:
  path: artifacts/rna_branch/pretrained/inputs/tcga_rna_full_gene.h5
  values_key: X
  row_ids_key: sample_idx
  col_ids_key: gene_ids

metadata:
  path: artifacts/rna_branch/2026-07-29_first_benchmark/inputs/sample_metadata.parquet
  id_column: sample_idx
  cancer_column: cancer_type
  split_column: split
  train_values: [train]
  validation_values: [validation, val]
  test_values: [test]

analysis:
  seed: 17
  chunk_size: 128
  reconstruction_gene_count: 4096
  # Primary capacity match. Native-width embeddings are reported but cannot win.
  matched_encoder_dimensions: [256]
  primary_encoder_dimension: 256
  # Raw-RNA controls retained to quantify the encoder information gap.
  pca_dimensions: [64, 256]
  random_projection_dim: 256
  # Alpha is selected by stratified CV inside train; validation is confirmation.
  ridge_alphas: [0.01, 0.1, 1.0, 10.0, 100.0]
  ridge_cv_folds: 5
  knn_k: 15
  pair_sample_count: 50000
  geometry_splits: [train, validation, test, all]
  allow_partial_overlap: false
