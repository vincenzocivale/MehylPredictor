[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "methylation-predictor"
version = "0.3.0"
description = "Scope-general CpG-statistics and RNA-conditioned DNA methylation prediction"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "slow: reads real multi-GB slices of the canonical TCGA bundle (exact regression counts, not something to fake-speed-up)",
]
